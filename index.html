<script>

"use strict";
// ================= DISPLAY =================
const SW=264,SH=216,H=136,WMAX=480,COLS=42;let W=264;
const scr=document.getElementById('scr'),sctx=scr.getContext('2d');
const glowC=document.getElementById('glow'),gctx=glowC.getContext('2d');
const noiseC=document.getElementById('noise'),nctx=noiseC.getContext('2d');
const crt=document.getElementById('crt'),inp=document.getElementById('inp');
const IMGD=sctx.createImageData(SW,SH),BUF=new Uint32Array(IMGD.data.buffer);
function rgb(h){const n=parseInt(h.slice(1),16);return (255<<24)|((n&255)<<16)|(((n>>8)&255)<<8)|(n>>16)}
const PAL=['#020807','#062320','#0d3e39','#17645b','#2d9488','#5fcfc0','#b9fff4'].map(rgb);
const RPAL=['#020807','#2a0409','#5c0a16','#951425','#d42c3a','#ff6a62','#ffc4b8'].map(rgb);
const C_TXT=rgb('#9cf7ea'),C_DIM=rgb('#3f8f86'),C_HI=rgb('#e2fffb'),C_DARK=rgb('#031210'),C_ROLL=rgb('#c8fff6'),C_RED=rgb('#ff6a62');
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
const GL={};for(const k in FONT){const s=FONT[k],a=[];for(let i=0;i<18;i+=2)a.push(parseInt(s.substr(i,2),16));GL[k]=a}
function san(s){return s.replace(/[’‘`]/g,"'").replace(/[“”«»]/g,'"').replace(/[—–]/g,'-').replace(/…/g,'...').replace(/°/g,'o').replace(/[ăâ]/g,'a').replace(/[țţ]/g,'t').replace(/[șş]/g,'s').replace(/[öô]/g,'o').replace(/[üû]/g,'u').replace(/ç/g,'c').replace(/[äá]/g,'a').replace(/í/g,'i').replace(/ó/g,'o').replace(/ú/g,'u').replace(/[ÄÁ]/g,'A').replace(/[ÖÓ]/g,'O').replace(/[ÜÚ]/g,'U')}
function glyph(ch){return GL[ch]||GL['?']}
function dstr(x,y,s,col,jit){for(let i=0;i<s.length;i++){const g=glyph(s[i]);const yy=y+(jit?((i*7+s.charCodeAt(i))%3)-1:0);for(let r=0;r<9;r++){const row=g[r];if(!row)continue;for(let b=0;b<6;b++)if(row&(32>>b)){const X=x+i*6+b,Y=yy+r;if(X>=0&&Y>=0&&X<SW&&Y<SH)BUF[Y*SW+X]=col}}}}
function fit(){const vv=window.visualViewport;const vw=vv?vv.width:innerWidth,vh=vv?vv.height:innerHeight;
 let s=Math.min((vw-12)/SW,(vh-40)/SH);s=Math.max(1,s);const w=Math.floor(SW*s),h=Math.floor(SH*s);
 crt.style.width=w+'px';crt.style.height=h+'px';const ph=Math.max(2,h/SH);
 crt.querySelector('.scan').style.setProperty('--h1',(ph*.55).toFixed(2)+'px');crt.querySelector('.scan').style.setProperty('--h2',ph.toFixed(2)+'px')}
addEventListener('resize',fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit);fit();

// ================= PIXEL LIB =================
const L=new Float32Array(WMAX*H),R=new Float32Array(WMAX*H),MK=new Uint8Array(WMAX*H);let MKON=0;const SET=0,MAX=1,ADD=2,MUL=3,MIN=4;
function px(x,y,v,m){x=x|0;y=y|0;if(x<0||y<0||x>=W||y>=H)return;const i=y*W+x;if(MKON)MK[i]=1;
 if(!m){L[i]=v;R[i]=0}else if(m===1){if(v>L[i])L[i]=v}else if(m===2)L[i]+=v;else if(m===3)L[i]*=v;else if(v<L[i])L[i]=v}
function rp(x,y,v,m){x=x|0;y=y|0;if(x<0||y<0||x>=W||y>=H)return;const i=y*W+x;if(m===2)R[i]+=v;else if(v>R[i])R[i]=v}
function fill(v){L.fill(v);R.fill(0);MK.fill(0)}
function bpx(x,y,v){x=x|0;y=y|0;if(x<0||y<0||x>=W||y>=H)return;const i=y*W+x;if(!MK[i])L[i]+=v}
function vg(y0,y1,a,b,x0=0,x1=W){for(let y=y0;y<y1;y++){const v=a+(b-a)*(y-y0)/Math.max(1,y1-y0-1);for(let x=x0;x<x1;x++)px(x,y,v)}}
function rect(x,y,w,h,v,m){for(let j=0;j<h;j++)for(let i=0;i<w;i++)px(x+i,y+j,v,m)}
function frame(x,y,w,h,v,m){for(let i=0;i<w;i++){px(x+i,y,v,m);px(x+i,y+h-1,v,m)}for(let j=1;j<h-1;j++){px(x,y+j,v,m);px(x+w-1,y+j,v,m)}}
function ell(cx,cy,rx,ry,v,m){for(let y=Math.floor(cy-ry);y<=cy+ry;y++)for(let x=Math.floor(cx-rx);x<=cx+rx;x++){if(((x+.5-cx)/rx)**2+((y+.5-cy)/ry)**2<=1)px(x,y,v,m)}}
function disc(cx,cy,r,v,m){ell(cx,cy,r,r,v,m)}
function poly(p,v,m){let a=1e9,b=-1e9;const n=p.length/2;for(let i=1;i<p.length;i+=2){a=Math.min(a,p[i]);b=Math.max(b,p[i])}
 for(let y=Math.floor(a);y<=b;y++){const yc=y+.5,xs=[];for(let i=0;i<n;i++){const x1=p[i*2],y1=p[i*2+1],x2=p[((i+1)%n)*2],y2=p[((i+1)%n)*2+1];if((y1<=yc&&y2>yc)||(y2<=yc&&y1>yc))xs.push(x1+(yc-y1)/(y2-y1)*(x2-x1))}
  xs.sort((q,r)=>q-r);for(let k=0;k+1<xs.length;k+=2)for(let x=Math.round(xs[k]);x<Math.round(xs[k+1]);x++)px(x,y,v,m)}}
function line(x0,y0,x1,y1,v,m){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1);for(let i=0;i<=n;i++)px(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),v,m)}
function tline(x0,y0,x1,y1,w,v,m){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1);for(let i=0;i<=n;i++)disc(x0+(x1-x0)*i/n,y0+(y1-y0)*i/n,w/2,v,m)}
function glow(cx,cy,r,a){for(let y=Math.floor(cy-r);y<=cy+r;y++)for(let x=Math.floor(cx-r);x<=cx+r;x++){const d=Math.hypot(x-cx,y-cy)/r;if(d<1)px(x,y,a*(1-d)*(1-d),ADD)}}
function rglow(cx,cy,r,a){for(let y=Math.floor(cy-r);y<=cy+r;y++)for(let x=Math.floor(cx-r);x<=cx+r;x++){const d=Math.hypot(x-cx,y-cy)/r;if(d<1)rp(x,y,a*(1-d)*(1-d),ADD)}}
function eye(x,y,a=1){rp(x,y,.95*a);rp(x+1,y,.7*a);rglow(x+.5,y,4,.35*a)}
function cone(x,y,w0,w1,h,a,dx=0){for(let j=0;j<h;j++){const f=j/h,w=w0+(w1-w0)*f,c=x+dx*f;for(let i=-w;i<=w;i++){const e=1-Math.abs(i)/w;px(c+i,y+j,a*(1-f*.6)*Math.min(1,e*2),ADD)}}}
function h2(x,y){let n=(x*374761393+y*668265263)|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=h2(xi,yi),b=h2(xi+1,yi),c=h2(xi,yi+1),d=h2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y){return vn(x,y)*.55+vn(x*2.1+5,y*2.1)*.3+vn(x*4.3,y*4.3+9)*.15}
// animated fog, computed on 2x2 blocks to keep it cheap
function fog(t,y0,y1,a,sc=24,sp=4,x0=0,x1=W){y0=Math.max(0,y0|0);y1=Math.min(H,y1|0);for(let y=y0;y<y1;y+=2){const e=Math.sin(Math.PI*(y-y0)/(y1-y0));for(let x=x0;x<x1;x+=2){const n=fbm((x+t*sp)/sc,y/(sc*.5)+t*.05);const f=Math.max(0,(n-.42)*2.6)*a*e;if(f>.004){px(x,y,f,ADD);px(x+1,y,f,ADD);px(x,y+1,f,ADD);px(x+1,y+1,f,ADD)}}}}
function tex(x0,y0,w,h,a,sc=3,sd=1){for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)px(x,y,(vn(x/sc+sd*13,y/sc)-.5)*a,ADD)}
function grain(x0,y0,w,h,a,sd=1){for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)px(x,y,(h2(x+sd*999,y)-.5)*a,ADD)}
function rng(s){return function(){s=(s+0x6D2B79F5)|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rain(t,a=.3,n=110,sl=.3){const r=rng(7);for(let i=0;i<n;i++){const x0=r()*W*1.3,sp=110+r()*60,y=((r()*160+t*sp)%(H+12))-12;let x=(x0-y*sl)%W;if(x<0)x+=W;line(x,y,x-2*sl*3,y+6,a,ADD)}}
function snow(t,a=.5,n=120,y1=H){const r=rng(11);for(let i=0;i<n;i++){const x0=r()*W,sp=8+r()*14,ph=r()*6;const y=((r()*y1+t*sp)%y1);const x=(x0+Math.sin(t*.8+ph)*6+W)%W;px(x,y,a*(.5+r()*.5),MAX)}}
function sparkle(x,y,t,ph=0,a=1){const k=(Math.sin(t*6+ph)+1)/2;px(x,y,.6+.4*k*a,MAX);if(k>.6){px(x-1,y,.5*a,MAX);px(x+1,y,.5*a,MAX);px(x,y-1,.5*a,MAX);px(x,y+1,.5*a,MAX)}if(k>.9){px(x-2,y,.35*a,MAX);px(x+2,y,.35*a,MAX);px(x,y-2,.35*a,MAX);px(x,y+2,.35*a,MAX)}}
function ltxt(s,x,y,v,sc=1,sk=0,m,red){for(let i=0;i<s.length;i++){const g=glyph(s[i]);for(let r=0;r<9;r++)for(let b=0;b<6;b++)if(g[r]&(32>>b))for(let j=0;j<sc;j++)for(let k=0;k<sc;k++){const yy=r*sc+j;const X=x+(i*6+b)*sc+k-Math.round(sk*yy),Y=y+yy;const vv=typeof v==='function'?v(yy):v;if(red)rp(X,Y,vv);else px(X,Y,vv,m)}}}
function stars(n=60,y1=60,sd=3,x0=0,x1=W){const r=rng(sd);for(let i=0;i<n;i++){const x=x0+r()*(x1-x0),y=r()*y1,k=r();px(x,y,.12+.3*k*k,MAX);if(k>.93){px(x+1,y,.12,MAX);px(x-1,y,.12,MAX);px(x,y+1,.12,MAX);px(x,y-1,.12,MAX)}}}
function twinkle(t,n=14,y1=60,sd=5){const r=rng(sd);for(let i=0;i<n;i++){const x=r()*W,y=r()*y1,k=r();if(L[(y|0)*W+(x|0)]<.12)px(x,y,.15+.35*((Math.sin(t*2.2+k*40)+1)/2),MAX)}}
function moon(cx,cy,r,a=.62,halo=1){if(halo)glow(cx,cy,r*2.6,a*.32);for(let y=Math.floor(cy-r);y<=cy+r;y++)for(let x=Math.floor(cx-r);x<=cx+r;x++){const dx=(x+.5-cx)/r,dy=(y+.5-cy)/r,d=dx*dx+dy*dy;if(d<=1){const n=fbm(x/(r*.32)+3,y/(r*.32));const mare=n>.55?.78:1;px(x,y,a*(.62+.5*n)*mare*(1-.3*d)*(.72+.28*Math.max(0,.3-dx)),SET)}}}
function clouds(t,y0,y1,a,sc=30,sp=3,th=.45){for(let y=y0;y<y1;y+=2)for(let x=0;x<W;x+=2){const n=fbm((x+t*sp)/sc,y/(sc*.45));if(n>th){const f=Math.min(1,(n-th)*4);for(let k=0;k<4;k++){const X=x+(k&1),Y=y+(k>>1);const i=Y*W+X;if(X<W&&Y<H)L[i]=L[i]*(1-f*.85)+a*f*(.6+.8*(n-th))}}}}
// edge light on dark silhouettes facing a light source

 for(const a of acts){for(const k of a.k){if(k[0]==='='){if(ws.includes(k.slice(1)))return a}else if(k.includes(' ')){if((' '+n+' ').includes(' '+k))return a}else if(ws.some(w=>kmatch(w,k)))return a}}return null}
function findObj(map,ws){if(!map)return null;for(const key in map){const ks=key.split('|');for(const w of ws)if(ks.some(k=>kmatch(w,k)))return map[key]}return null}
function itemObjs(){const o={};if(S.v.includes('IL CROCIFISSO DI BISTRITZ'))o['rosario|crocifisso|croce']="Il rosario della locandiera di Bistritz: grani scuri, un piccolo Cristo d'argento. Ti tiene compagnia come una mano sulla spalla.";
 o['diario|taccuino|quaderno']="Il tuo diario: scrivi DIARIO per rileggere indizi e vantaggi.";o['candel|lucidita|mente']="Lucidità: "+S.luc+" candele su 3. Ogni orrore ne spegne una.";return o}
function suggest(n){const ws=words(n);let best=null,bd=3;const cands=[];for(const a of curActs()){if(a.h)cands.push([norm(a.h),a.h]);for(const k of a.k)if(k[0]!=='='&&k.length>3)cands.push([k,a.h||k])}
 const sc=SC[S.scene];for(const map of[sc.objs,sc.topics])if(map)for(const key in map)for(const k of key.split('|'))cands.push([k,'GUARDA '+k.toUpperCase()]);
 for(const w of ws)for(const[k,lab]of cands){const d=lev(w,k.slice(0,Math.max(w.length,3)));if(d<bd&&w.length>3){bd=d;best=lab}}return best}

SC.j_inn={img:'locanda',who:'LOCANDIERA',pbg:'inn',mus:'castello',amb:'fuoco',enter(){if(!has('c1')){set('c1');chapter('DIARIO DI JONATHAN HARKER','I. LA VIGILIA DI SAN GIORGIO','Bistritz, Transilvania - 4 maggio 1893','J');shot('locanda')}},
 text:()=>"Bistritz, albergo Corona d'Oro. Sei Jonathan Harker, giovane procuratore di Exeter. Il tuo studio ti ha mandato fin qui per concludere la vendita di una casa londinese a un nobile dei Carpazi: il Conte Dracula. Domani la diligenza ti lascerà al Passo del Borgo, dove ti aspetterà la sua carrozza.\nQuando chiedi della diligenza, la vecchia locandiera impallidisce.",
 objs:{'fuoco|camino':"Un fuoco di ceppi di faggio. Ti scalda le mani, ma non riesce a scaldare la stanza.",'finestr|montagn':"Fuori, le cime dei Carpazi si spengono nel blu della sera. Lassù, da qualche parte, il castello.",'locandier|donna|vecchia':"@LOCANDIERA|Una donna piccola, con un fazzoletto in testa e le mani rovinate dal lavoro. Ti guarda come si guarda un figlio che parte per la guerra.",'marito|oste':"Il marito, dietro il banco, finge di asciugare un bicchiere già asciutto. Non ti guarda.",'cena|pollo|paprika':"Pollo alla paprika, 'robber steak'. Ottimo. Annoti la ricetta per Mina."},
 topics:{'conte|dracula|castello':"@LOCANDIERA|Al nome del Conte la donna si fa il segno della croce e finge di non capire più il tedesco.",'vigilia|giorgio|mezzanotte':"@LOCANDIERA|'Stanotte i morti escono. Lo sanno anche i bambini, signore. Tutti tranne lei.'"},
 after(){if(has('innq'))return;set('innq');say('LOCANDIERA',"'Deve proprio andare? Oh, giovane signore, deve proprio?' Si torce le mani nel grembiule. 'Non sa che giorno è oggi? È la vigilia di San Giorgio. Stanotte, quando l'orologio batterà la mezzanotte, tutte le cose malvagie del mondo avranno pieno potere.'");clue('vigilia')},
 acts:()=>[A('rassicur|dover|lavoro|devo|tranquill|calma','RASSICURALA',()=>{if(has('offer'))return say('LOCANDIERA',"'Allora lo tenga stretto,' mormora. 'E non si fidi della notte.'");set('offer');say('LOCANDIERA',"'Signora, ho degli affari da concludere. Mi aspettano.'\nLei si inginocchia ai tuoi piedi, piangendo, e si sfila dal collo un rosario con un piccolo crocifisso d'argento.\n'Allora lo prenda. Per amor di sua madre.'");shot('i_rosario');out("Lo PRENDI, o lo RIFIUTI con garbo?")},null,'rassicurarla che deve partire per lavoro'),
  A('letter|leggi|biglietto','LETTERA',()=>{qimg('lettera_conte');qfn(()=>SND.sfx('page'));out("Rileggi la lettera che il Conte ti ha fatto trovare in albergo. Una grafia elegante, d'altri tempi. 'Venga liberamente. Vada sicuro.' Cortese, impeccabile. Eppure ti si stringe lo stomaco.");refresh()},null,'rileggere la lettera del Conte'),
  A('prend|accett|tieni|grazie|indoss|mett','PRENDI',()=>{set('cross');set('offer',2);say('LOCANDIERA',"Lasci che te lo metta al collo. Da buon anglicano lo trovi quasi un feticcio, ma non hai cuore di dirle di no.\n'Dio la protegga,' sussurra. È l'ultima cosa che ti dice.");vant('IL CROCIFISSO DI BISTRITZ')},()=>S.f.offer===1,'accettare il rosario'),
  A('rifiut|no grazie|non voglio|lascia','RIFIUTA',()=>{set('offer',2);say('LOCANDIERA',"'Grazie, signora, ma non serve.' Lei ti guarda come si guarda un uomo già morto. Posa il rosario sul tavolo e se ne va senza una parola.")},()=>S.f.offer===1,'rifiutare il rosario'),
  A('part|dorm|domani|vai|diligenz|avanti|letto','PARTI',()=>{if(!has('offer')){say('LOCANDIERA',"La vecchia ti si para davanti alla scala. 'Mi ascolti, signore. La prego.'");return}if(S.f.offer===1){out("La donna è ancora in ginocchio, il rosario teso verso di te. PRENDI o RIFIUTA?");return}go('j_coach')},null,'andare a dormire e partire')]};
SC.j_coach={img:'diligenza',mus:'viaggio',amb:'vento',text:()=>"5 maggio. La diligenza sale per ore tra foreste di faggi e pini, sotto montagne innevate che il tramonto tinge di rosa. Ai bordi della strada, croci di legno. Il cocchiere frusta i cavalli come se avesse fretta di arrivare prima del buio.\nI passeggeri, saputo dove vai, ti guardano con pietà. Sussurrano parole che non capisci. Una donna ti porge un mazzetto di fiori.",
 objs:{'croc|croci|strada':"Croci di legno ai bordi della strada, ognuna con un piccolo tetto. Ogni volta che ne passate una, tutti si segnano.",'passegger|gente|donna':"Contadini, un mercante, una donna con un fazzoletto rosso. Tutti, quando li guardi, distolgono lo sguardo.",'cocchier|cavall':"Il cocchiere frusta i cavalli senza pietà. Guarda il sole che scende come si guarda un nemico."},
 acts:()=>[A('parole|ascolt|chied|sussurr|cosa dic|traduc','ASCOLTA',()=>{out("Le parole tornano più volte: 'Ordog', 'pokol', 'stregoica', 'vrolok', 'vlkoslak'.\nCon il dizionario poliglotta riesci a tradurle. Satana. Inferno. Strega. E le ultime due, in serbo e in slovacco, vogliono dire la stessa cosa: lupo mannaro. O vampiro.");clue('parole')},null,'ascoltare i passeggeri'),
  A('fiori|doni|regal|prend|aglio|accett','I DONI',()=>{if(has('gifts'))return out("Tieni stretti i doni dei passeggeri: aglio, rose canine, sorbo selvatico.");set('gifts');out("Aglio, rose canine, un rametto di sorbo. Ognuno te li porge facendosi il segno della croce e puntandoti contro due dita, contro il malocchio. Li ringrazi. Li tieni.");vant('I DONI DEI PASSEGGERI')},null,'accettare i doni dei passeggeri'),
  A('paesagg|guard fuori|montagn|finestr|tramont','PAESAGGIO',()=>out("Le cime dei Carpazi si accendono di viola e d'oro, poi si spengono una a una. Quando cala il buio, i passeggeri smettono di parlare. Qualcuno prega."),null,'guardare il paesaggio'),
  A('avanti|vai|aspett|borgo|arriv|passo|prosegu','AL PASSO',()=>go('j_pass'),null,'proseguire fino al Passo del Borgo')]};
SC.j_pass={img:'borgo_caleche',who:'COCCHIERE',pbg:'night',mus:'viaggio',amb:'notte',text:()=>"Il Passo del Borgo, di notte. La strada è vuota. Il cocchiere della diligenza ride, sollevato: 'Non c'è nessuna carrozza. Il signore viene con noi in Bucovina.'\nIn quell'istante quattro cavalli neri escono dal buio, tirando una calèche. Il cocchiere è alto, la barba scura, il cappello calato sugli occhi. Alla luce delle lanterne, i suoi occhi mandano un lampo rosso.",
 objs:{'cavall':"Quattro stalloni neri come la pece, splendidi. Non sudano, non sbuffano. Ti guardano.",'lantern|luce':"Lanterne di ferro battuto. La luce trema, ma il vento non c'entra.",'calech|carrozz':"Una calèche antiquata, elegante, con lo stemma consumato di una casata antica."},
 topics:{'conte|padrone':"@COCCHIERE|'Il mio padrone la aspetta, mein Herr. Da molto tempo.'",'notte|lupi|fiamm':"@COCCHIERE|'La notte è lunga, quassù. Ma lei non deve avere paura. Non stanotte.'"},
 after(){qfn(()=>SND.sfx('hooves'));say('COCCHIERE',"'Sei in anticipo, stanotte, amico mio,' dice al cocchiere della diligenza. 'Ecco perché volevi portarlo in Bucovina. Non puoi ingannarmi. So troppe cose, e i miei cavalli sono veloci.'\nSorride. Le labbra sono rossissime. I denti, aguzzi e bianchi come avorio.")},
 acts:()=>[A('sali|monta|carrozz|caleche|calesse|parti|vai|andiamo','SALI',()=>{say('COCCHIERE',"Ti afferra il braccio con una presa d'acciaio e ti issa a bordo come un bambino.\n'La notte è fredda, mein Herr. Il mio padrone, il Conte, mi ha detto di avere ogni cura di voi.'");go('j_flames')},null,'salire sulla calèche'),
  A('cocchier|uomo|occhi|guard|chi','COCCHIERE',()=>say('COCCHIERE',"Non riesci a vedergli il viso: il cappello lo nasconde. Vedi solo la barba, la bocca rossa, quel lampo negli occhi. Ti fa un cenno verso la calèche, con una pazienza infinita."),null,'osservare il cocchiere'),
  A('rest|diligenz|bucovin|no|rifiut','RESTA IN DILIGENZA',()=>out("Fai per risalire sulla diligenza. Il cocchiere della diligenza ti chiude la porta in faccia, terrorizzato, e frusta i cavalli. Sei solo, sulla strada, con la calèche nera che ti aspetta."),null,'restare sulla diligenza')]};
SC.j_flames={img:'borgo_fiamma',mus:'tensione',amb:'notte',text:()=>"La calèche corre nel buio per un tempo che sembra infinito. A volte ti pare di girare in tondo.\nTra gli alberi si accendono fiammelle azzurre. Ogni volta il cocchiere ferma i cavalli, scende, va verso la fiamma, ammucchia qualche sasso intorno, e risale senza una parola.",
 objs:{'fiamm|azzurr|fuoco':"Una fiamma azzurra, fredda, che non brucia l'erba. Si dice che nella notte di San Giorgio segnino i tesori sepolti.",'alber|bosco|pin':"Pini neri, fitti come un muro. Ogni tanto, tra i tronchi, un riflesso. Occhi."},
 acts:()=>[A('osserv|guard|fiamm|cocchier|attento|studia','OSSERVA',()=>{out("Il cocchiere si ferma proprio tra te e la fiamma. Eppure la fiamma non si oscura: la vedi tremare, azzurra, attraverso il suo corpo. Come se lui non ci fosse.");twist();clue('trasparente');go('j_wolves')},null,'osservare il cocchiere e la fiamma'),
  A('chiam|chied|cosa|perche|domand','CHIEDI',()=>{out("'Che cosa sono quelle fiamme?' Il cocchiere non risponde. Forse non ti ha sentito. Forse sì.");go('j_wolves')},null,'chiedere delle fiamme'),
  A('scend|fiamma|tesor|scav|vai','SCENDI A VEDERE',()=>{out("Fai per scendere verso la fiamma. Il cocchiere è davanti a te prima che tu tocchi terra. 'No, mein Herr. Quei tesori non sono per lei.' Ti rimette a sedere. Non l'hai visto muoversi.");guaio('IL CONTE TI OSSERVA');go('j_wolves')},null,'scendere verso la fiamma'),
  A('aspett|resta|dorm|zitt|niente|prega','ASPETTA',()=>{out("Ti stringi nel mantello e conti i minuti. Ogni tanto, lontano, un ululato.");go('j_wolves')},null,'restare fermo')]};
SC.j_wolves={img:'lupi',who:'COCCHIERE',pbg:'night',mus:'tensione',amb:'notte',text:()=>"Poi la luna esce dalle nuvole, e i cavalli si impennano.\nSiete circondati. Lupi: un cerchio di denti bianchi e lingue rosse penzolanti, muscoli lunghi, pelo irto. Troppo silenziosi per essere veri.\nE il cocchiere non c'è.",
 enter(){qfn(()=>SND.sfx('wolves'))},
 objs:{'lupi|lupo|denti':"Decine. Non ringhiano. Aspettano. Uno, il più grande, ha un orecchio strappato e ti fissa senza battere ciglio.",'luna':"La luna è piena, gonfia, troppo vicina."},
 acts:()=>[A('aspett|resta|ferm|zitt|immobil|guard','RESTA FERMO',()=>{out("Resti immobile, il cuore che martella. Dal buio esce il cocchiere, con calma. Alza le braccia, e i lupi indietreggiano uno a uno, a testa bassa, come cani bastonati.\nQuando risale a cassetta non ha un solo fiocco di neve addosso.");if(scare('i lupi del Borgo'))return;arrive()},null,'restare fermo, sicuro ma terrorizzato'),
  A('grid|urla|chiam|batt|rumor','GRIDA',()=>{out("Gridi, picchi sul fianco della carrozza. I lupi non si muovono.\nPoi, dal buio, un comando aspro, in una lingua più vecchia del tedesco. Il cocchiere è in piedi sulla strada, le braccia alzate. Il cerchio si apre. I lupi svaniscono.");arrive()},null,'gridare, fare rumore'),
  A('prega|rosario|crocif|croce|fiori|aglio|fede','AFFRONTALI',()=>RK({skill:'FEDE',diff:7,what:"Alzare "+(has('cross')?"il rosario":"i fiori dei passeggeri")+" contro i lupi",win:"Li respingi e non perdi lucidità. Ne esci più forte.",lose:"Il terrore ti morde: perdi una candela di lucidità.",
   onWin(){shot('i_rosario');out("Ti alzi in piedi sulla carrozza e tendi la mano. Il lupo più vicino abbassa la testa e guaisce, come se il vento gli avesse portato un odore insopportabile. Uno dopo l'altro, indietreggiano.");vant('NERVI SALDI');arrive()},onLose(){out("La mano ti trema. Il grande lupo con l'orecchio strappato ti salta quasi in grembo; si ferma a un palmo dalla tua gola. Poi un fischio dal buio, e tutti spariscono.");if(scare('il fiato del lupo sul viso'))return;arrive()}}),null,'affrontare i lupi con la fede (prova)'),
  A('scend|salta|esci|scapp|corr|fugg|bosco','SCENDI E FUGGI',()=>death('lupi','lupi',"Salti giù dalla carrozza e corri verso il bosco.\nNon fai dieci passi. I lupi non ringhiano nemmeno: ti chiudono il cerchio addosso in silenzio, come un'onda.\nL'ultima cosa che senti è un fischio lontano, e una risata."),null,'saltare giù e fuggire nel bosco')]};
function arrive(){shot('castello_ext');qfn(()=>SND.sfx('hooves'));out("Il viaggio riprende, in salita, per ore. Poco prima dell'alba la calèche entra nel cortile di un castello in rovina, così alto che le torri si perdono tra le stelle.\nIl cocchiere scarica i bagagli e se ne va. Resti solo, davanti a una porta enorme, borchiata di ferro.");go('j_door')}
// ================= II. IL CASTELLO =================
SC.j_door={img:'soglia',who:'CONTE',pbg:'night',mus:'castello',amb:'vento',enter(){qfn(()=>SND.sfx('chains'));qfn(()=>SND.sfx('door'))},text:()=>"Un rumore di catene, un chiavistello che stride. La porta si apre.\nUn vecchio alto, rasato tranne lunghi baffi bianchi, vestito di nero dalla testa ai piedi. Regge una lampada d'argento senza paralume, la cui fiamma trema nella corrente.",
 objs:{'lampad|lume':"Una lampada d'argento antica. La fiamma si piega verso di te, come se l'aria del castello respirasse.",'porta|soglia':"Una soglia di pietra consumata da secoli di passi. Il Conte non la oltrepassa."},
 after(){say('CONTE',"'Benvenuto nella mia casa! Entri liberamente e di sua spontanea volontà!'\nNon fa un passo verso di te. Resta oltre la soglia, e aspetta.")},
 acts:()=>[A('entr|varc|soglia|avanti|accett|=si','ENTRA',()=>{out("Varchi la soglia. Solo allora lui si muove: ti stringe la mano, e la sua è fredda come il ghiaccio. Più la mano di un morto che di un vivo. E stringe come una morsa.\nLa stessa, identica stretta del cocchiere.");twist();clue('stretta');say('CONTE',"'Benvenuto nella mia casa. Entri liberamente, vada sicuro, e lasci qui un po' della felicità che porta con sé.'\n'Il Conte Dracula?'\n'Io sono Dracula. E le do il benvenuto, signor Harker. Entri: l'aria della notte è fredda, e lei avrà bisogno di mangiare e riposare.'");go('j_dinner')},null,'entrare nel castello'),
  A('mano|strin|salut','MANO',()=>say('CONTE',"Gli tendi la mano oltre la soglia. Lui non si sposta di un pollice; sorride, cortese, e aspetta.\n'La prego. Entri lei. In questa casa le soglie si varcano da sé.'"),null,'tendere la mano'),
  A('rifiut|aspett|esit|torna|indietr|no','ESITA',()=>{S.f.hes=(S.f.hes||0)+1;if(S.f.hes>=3)return death('soglia','porta_lupi',"Esiti ancora. Il sorriso del Conte non cambia. Ma la porta, lentamente, si chiude.\n'Come desidera.'\nIl chiavistello scatta. Alle tue spalle, nel cortile, cento zampe sulla neve.");out("Esiti. Alle tue spalle, nel buio, ricominciano gli ululati.");qfn(()=>SND.sfx('howl'));say('CONTE',S.f.hes===1?"Il Conte inclina la testa, come per una musica che solo lui sente.\n'Ascolti... i figli della notte. Che musica fanno!'":"'La notte è fredda, signor Harker. E i miei figli sono affamati. Non mi faccia aspettare.'")},null,'esitare sulla soglia')]};
SC.j_dinner={img:'cena_fuoco',who:'CONTE',pbg:'fire',mus:'castello',amb:'fuoco',text:()=>"Una sala di pietra, un fuoco di ceppi alto come un uomo, una cena di pollo arrosto, formaggio e un vecchio Tokaji. Il Conte non mangia: 'Ho già cenato, e non ceno mai due volte.'\nAlla luce delle candele lo studi: naso aquilino, fronte alta, sopracciglia che quasi si toccano. Orecchie pallide e appuntite. La bocca, sotto i baffi, è crudele, e i denti sporgono sulle labbra.",
 objs:{'fuoco|camino':"Ceppi interi che bruciano senza fumo. Il calore non arriva fino al Conte. Sembra non riguardarlo.",'armatur':"Un'armatura antica, ammaccata da colpi veri. La spada è appoggiata, non appesa: come se qualcuno la usasse ancora.",'tavol|cena|piatt':"Argento antico, tovaglie di lino. Un solo coperto: il tuo.",'arazz':"Un arazzo con un drago. Lo stemma della casata: Dracul, il drago."},
 topics:{'cocchier|viaggio|fiamm':"@CONTE|'Spero che il mio cocchiere sia stato... premuroso. Le fiamme azzurre? Segnano i tesori nascosti, nella notte di San Giorgio. Ma i miei contadini sono codardi e sciocchi: non vanno mai a scavare.'",'servi|servitu':"@CONTE|'Servi? Sono un uomo all'antica, signor Harker. Mi servo da solo. È più sicuro.'"},
 acts:()=>[A('mani|osserv|studia','LE SUE MANI',()=>{shot('mani');out("Quando le mani del Conte si posano sul tavolo, accanto alle tue, le guardi bene. Larghe, le dita tozze. E al centro del palmo crescono dei peli. Le unghie sono lunghe, sottili, tagliate a punta.\nLui si china verso di te e ti sfiora. Un brivido, una nausea che non riesci a nascondere. Il Conte ritira le mani, con un sorriso.");clue('mani');refresh()},null,'osservare le sue mani'),
  A('lupi|ulul|figli|notte|music','I LUPI',()=>{qfn(()=>SND.sfx('wolves'));say('CONTE',"Fuori, nella valle, i lupi ululano. Gli occhi del Conte si accendono.\n'Ascolti. I figli della notte. Che musica fanno!'\nPoi, vedendo la tua faccia: 'Ah, signore, voi gente di città non potete capire i sentimenti del cacciatore.'")},null,'parlare dei lupi'),
  A('mang|cena|bev|vino|tokaj|pollo','MANGIA',()=>out("Il pollo è eccellente, il vino denso come miele. Il Conte ti guarda mangiare con un'attenzione che non ti piace: come un uomo guarda maturare un frutto."),null,'mangiare e bere'),
  A('dorm|lett|stanc|congedo|basta|camera|ritir','RITIRATI',()=>{say('CONTE',"A est il cielo schiarisce. Il Conte si alza di scatto.\n'Ma ecco, di nuovo il mattino! Che negligenza da parte mia, tenerla sveglio così a lungo. Ci vedremo stasera.'\nUn inchino, e sparisce.");go('j_library')},null,'andare a dormire')]};
SC.j_library={img:'biblioteca',who:'CONTE',pbg:'room',mus:'castello',amb:'interno',enter(){if(!has('c2')){set('c2');chapter('DIARIO DI JONATHAN HARKER','II. IL CASTELLO','7 maggio 1893');shot('biblioteca')}},
 text:()=>"Nel castello non c'è un servo. Dormi di giorno, e la sera trovi la tavola apparecchiata da mani che non vedi.\nIn biblioteca il Conte ti aspetta tra centinaia di libri inglesi: storia, geografia, leggi, l'orario ferroviario Bradshaw, l'annuario della Marina. Sul tavolo, le carte della casa che gli hai trovato a Londra: CARFAX.",
 objs:{'libri|scaffal|bradshaw':"Libri inglesi, consumati a forza di essere letti: storia, leggi, economia, geografia. L'orario Bradshaw è pieno di sottolineature. Tutte le linee per il nord.",'mappa|carte geografic':"Una mappa d'Inghilterra. Alcuni punti cerchiati a matita: Londra est, Exeter, e Whitby, sulla costa dello Yorkshire."},
 acts:()=>[A('carfax|casa|propriet|document|atto|firma|affar|contratt','CARFAX',()=>{if(has('deed'))return say('CONTE',"'L'atto è firmato, amico mio. Carfax è mia.' Lo dice come altri direbbero: Londra è mia.");set('deed');shot('i_atto');qfn(()=>SND.sfx('quill'));out("Gli descrivi Carfax, a Purfleet: venti acri chiusi da un alto muro di pietra, una casa vecchissima con finestre come occhi ciechi, una cappella in rovina. Un unico vicino: un manicomio privato.");say('CONTE',"'Sono lieto che sia antica, e grande. Io vengo da una famiglia antica; vivere in una casa nuova mi ucciderebbe. E una cappella... Noi nobili transilvani non amiamo pensare che le nostre ossa giacciano tra i morti comuni.'\nFirma con una grafia elegante, di un altro secolo.");clue('carfax')},null,'mostrare l\'atto di Carfax e farlo firmare'),
  A('londra|inghilt|citta|navi|porti|inglese|libri','LONDRA',()=>{say('CONTE',"'Questi libri sono stati miei amici per molti anni. Voglio camminare tra la folla di Londra, essere uno di quei milioni. Qui sono un boiardo. Là sarei uno straniero, e uno straniero non è nessuno.'");say('CONTE',"Ti chiede dei porti del nord, delle navi, dei venti d'agosto. Pronuncia un nome con particolare cura, assaporandolo.\n'Whitby.'");clue('whitby')},null,'parlare di Londra'),
  A('stirpe|famigl|antenat|storia|battagl|szekely|guerr|turch','LA STIRPE',()=>{if(has('stirpe'))return say('CONTE',"'Lei fa molte domande, signor Harker.' Il sorriso non arriva agli occhi. 'È una virtù, in un avvocato. In un ospite, a volte, meno.'");set('stirpe');say('CONTE',"Si alza e cammina davanti al fuoco, e parla di battaglie come se le avesse viste.\n'Noi Szekely abbiamo il diritto di essere fieri. Quando il turco passò il Danubio, chi lo ricacciò indietro? Un Dracula! Il sangue è una cosa troppo preziosa, in questi tempi di pace disonorevole.'\nDice 'noi'. Sempre. Come un uomo che parla di sé.")},null,'chiedere della sua stirpe'),
  A('dorm|ritir|basta|avanti|mattin|lett','RITIRATI',()=>{if(!has('deed')){say('CONTE',"'Prima gli affari, amico mio.' Batte un'unghia sulle carte. 'Mi parli di CARFAX.'");return}say('CONTE',"Prima di congedarti, si ferma sulla soglia.\n'Un avvertimento, amico mio. Può andare dove vuole nel castello, tranne dove le porte sono chiuse. E non si addormenti mai, mai, in altre stanze. Il castello è vecchio, e ha molti ricordi. Ricordi cattivi, per chi dorme imprudentemente.'");go('j_mirror')},null,'congedarsi per la notte')]};
SC.j_mirror={img:'specchio',who:'CONTE',pbg:'moon',mus:'orrore',amb:'interno',text:()=>"Il mattino dopo appendi lo specchietto da barba alla finestra e cominci a raderti.\nUna mano ti si posa sulla spalla. 'Buongiorno.'\nSobbalzi. Lo specchio riflette tutta la stanza alle tue spalle.\nMa non c'è nessuno, nello specchio. Solo tu.",

SC.j_prison={img:'castello',mus:'orrore',amb:'vento',text:()=>"Quando il Conte se ne va, ti metti a esplorare. Scale, corridoi, porte. Porte ovunque, sbarrate e chiuse a chiave. Dalle finestre, solo precipizi: il castello sorge sull'orlo di un abisso, e sotto ci sono soltanto foreste e un fiume d'argento che serpeggia tra le gole.\nIl castello è una vera prigione. E tu sei il prigioniero.",

SC.j_wall={img:'finestra',mus:'orrore',amb:'vento',text:()=>"Notte. Dalla finestra guardi il cortile illuminato dalla luna. Una finestra più in basso, quella della stanza del Conte, si apre.\nNe esce la testa del Conte. Poi le spalle. Poi tutto il corpo.\nE il Conte comincia a scendere lungo il muro, a testa in giù, il mantello aperto come due grandi ali, aggrappandosi alle pietre con le dita e le unghie. Come una lucertola.",

SC.j_letters={img:'lettere',who:'CONTE',pbg:'fire',mus:'castello',amb:'fuoco',text:()=>"Il giorno dopo il Conte ti trova allo scrittoio.\n'Amico mio, scriva ai suoi. Dica che il lavoro procede bene, e che tornerà presto. Tre lettere.' Detta le date, una per una: 12 giugno, 19 giugno, 29 giugno.\nTi bastano pochi secondi per capire. Le date della tua vita, misurate col contagocce.",

SC.j_women={img:'sorelle',who:'SORELLE',pbg:'moon',mus:'sorelle',amb:'interno',enter(){set('sisters');clue('sorelle')},text:()=>"Quella notte, una porta che il Conte credeva chiusa cede alla spalla. Stanze antiche, mobili coperti di polvere, la luna che entra a fiotti da finestre senza tende. È bello, qui. È pace.\nTi stendi su un divano, contro ogni avvertimento. Ti addormenti.\nTi svegli. Non sei solo. Tre donne, nella luce della luna, non fanno ombra sul pavimento.",

SC.j_mother={img:'cortile_madre',mus:'orrore',amb:'notte',text:()=>"Il giorno dopo, al tramonto, un grido sale dal cortile. Una donna, i capelli sciolti, batte i pugni contro il portone, le mani premute sul cuore come chi ha corso a lungo.\n'Mostro, ridammi mio figlio!'\nDall'alto, dalla torre, il Conte risponde con un richiamo aspro. Da ogni lato, dal bosco, accorrono i lupi.",

SC.j_door2={img:'porta_lupi',who:'CONTE',pbg:'night',mus:'orrore',amb:'vento',text:()=>"29 giugno. Il Conte ti annuncia che partirai domani. 'Domani, amico mio, dovremo separarci.'\n'Perché non stanotte?' Lui sorride, e apre per te il grande portone.\nFuori, sulla soglia, i lupi. Decine. Le fauci rosse, gli occhi accesi, aspettano solo un cenno.",

SC.j_leech={img:'conte_cassa',mus:'orrore',amb:'cripta',text:()=>"All'alba torni giù, per l'ultima volta, cercando la chiave.\nIl Conte giace nella cassa. Ma è cambiato: i capelli e i baffi, da bianchi, sono diventati grigio scuro; le guance più piene, la pelle rosea. Dagli angoli della bocca cola un filo di sangue fresco.\nSembra semplicemente gonfio di sangue. Come una sanguisuga immonda, sazia.\nSopra di te, le martellate degli zingari: stanno venendo a inchiodare il coperchio.",
