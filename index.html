SC.j_escape={img:'muro',mus:'caccia',amb:'vento',text:()=>"Martellate: gli zingari inchiodano le casse e le caricano sui carri. Il Conte parte per l'Inghilterra. Stanotte le sorelle verranno a prenderti.\nL'unica via è il muro: giù, oltre la stanza del Conte, fino al precipizio e al fiume. Prendi un po' d'oro e la giacca col diario.\n'Almeno Dio. Non quei mostri.'",
 acts:()=>[A('cala|scend|fugg|scapp|vai|salta|muro|fallo|avanti','GIÙ DAL MURO',()=>RK({skill:'AGILITÀ',diff:7,forced:1,what:"Fuggire calandoti nel precipizio fino al fiume",win:"Fuggi sano e salvo.",lose:"Cadrai nel fiume: sopravvivrai, ma con la febbre.",
   onWin(){S.jfate='S';out("Scendi come ha fatto lui, pietra dopo pietra, fino al fondo della valle. Corri giù per i boschi, verso il fiume, fino a crollare.");jend()},onLose(){S.jfate='P';out("A metà parete la pietra cede. Cadi. L'ultima cosa che vedi è il fiume, che ti viene incontro.");guaio('FEBBRE CEREBRALE');jend()}}),null,'calarsi giù e fuggire (prova obbligata)')]};
function jend(){shot('ospedale');out("Dei contadini ti raccolgono sulla riva. Un treno, un altro. Febbre, buio. Lupi che ti inseguono nei sogni.");S.jcross=has('cross')?1:0;go('m_whitby')}
// ================= IV. WHITBY =================
SC.m_whitby={img:'whitby_abbazia',who:'LUCY,SWALES',pbg:'sea',mus:'whitby',amb:'mare',enter(){if(!has('c4')){set('c4');chapter('DIARIO DI MINA MURRAY','IV. WHITBY','24 luglio 1893','M');shot('whitby_porto',1600);if(has('mletter')){qfn(()=>SND.sfx('page'));out("Una lettera, arrivata per vie misteriose: la grafia di Jonathan, in stenografia. Poche righe tremanti. 'Il Conte non è un uomo. Cinquanta casse. Whitby. Non fidarti di nessuno che venga dal mare.'",'n');clue('lettera');vant('IL MESSAGGIO DI JONATHAN')}}},
 text:()=>"Sei Mina Murray, maestra, fidanzata di Jonathan. Stenografi e scrivi a macchina più veloce di chiunque tu conosca.\nLucy Westenra, la tua amica più cara, ti ha portata al mare a Whitby. Dalla scogliera guardi il porto, i tetti rossi e, sull'altra sponda, le rovine dell'abbazia sopra 199 scalini.\nDa Jonathan, da un mese, nessuna notizia. Sulla vostra panchina, tra le lapidi, siede il vecchio SWALES.",
 objs:{'abbazi|rovin|chiesa':"Le arcate gotiche dell'abbazia, nere contro il cielo. Si dice che a una finestra appaia una dama bianca.",'mare|porto':"Il mare è troppo calmo. I pescatori guardano a nord e scuotono la testa.",'lapid|tomb|cimiter':"'Alla memoria di', 'perso in mare', 'perso in mare'. Tante tombe, pochi corpi."},
 topics:{'jonathan|fidanz':"@LUCY|'Scriverà, Mina cara. Gli uomini, quando lavorano, dimenticano che noi esistiamo. Poi tornano con un regalo e fanno finta di niente.'",'arthur|matrimon':"@LUCY|'Arthur ha gli occhi più buoni del mondo. Ci sposeremo in autunno. Sarai la mia damigella, vero?'"},
 acts:()=>[A('lucy|amica|parla con lucy|westenra|propost','LUCY',()=>{say('LUCY',"Lucy ti stringe il braccio, raggiante. 'Tre proposte in un giorno, Mina cara! Il dottor Seward, che dirige un manicomio e mi guardava come un caso clinico. Un texano, Quincey Morris, che parla come un romanzo d'avventure. E Arthur.' Arrossisce. 'Ho detto sì ad Arthur.'");say('LUCY',"'Perché non si possono sposare tre uomini, o quanti ne vogliono, e risparmiare tutti questi dispiaceri? Ma è un'eresia, e non devo dirla.'\nPoi, più piano: 'Ho ricominciato a camminare nel sonno. Come da bambina.'");clue('proposte')},null,'parlare con Lucy'),
  A('swales|vecchio|marinai','SWALES',()=>{say('SWALES',"'Lapidi! Tutte bugie, signorina. Metà di quelle tombe sono vuote: i marinai sono in fondo al mare. Il giorno del Giudizio arriveranno arrancando con le lapidi sotto il braccio, per dimostrare quanto erano bravi.'");say('SWALES',"Poi si fa serio, e guarda il mare piatto.\n'Sono vecchio. La morte la sento venire. Ce l'ho nell'aria, nel vento, nel sale. Qualcosa sta arrivando dal mare. E non è solo per me.'");clue('swales')},null,'parlare col vecchio Swales'),
  A('jonathan|letter|scriv','JONATHAN',()=>out("Rileggi l'ultima lettera dal castello, datata 29 giugno: tre righe fredde. 'Parto domani.' Non sembra lui. Non c'è una parola per te, una sola."),null,'pensare a Jonathan'),
  A('avanti|aspett|giorni|sera|notte','I GIORNI PASSANO',()=>go('s_renfield'),null,'far passare i giorni')]};
SC.s_renfield={img:'renfield',who:'RENFIELD,SEWARD',pbg:'cell',mus:'seward',amb:'manicomio',enter(){if(!has('c5')){set('c5');chapter('DIARIO DEL DOTTOR SEWARD','V. IL SANGUE È LA VITA','Purfleet, 5 agosto 1893','S');shot('seward_fono',1800)}},
 text:()=>"(Registrato sul fonografo.) Sono John Seward, dirigo il manicomio privato di Purfleet. Lucy ha rifiutato la mia proposta. Lavoro, per non pensare.\nIl mio paziente più singolare si chiama Renfield. Cattura mosche e le dà ai ragni. Poi dà i ragni ai passeri. Ieri mi ha chiesto un gattino. Oggi ho scoperto che si è mangiato i passeri. Crudi.\nLo definirei un maniaco zoofago: mangiatore di vite.",
 objs:{'mosche|ragni|passer':"Sul davanzale, mosche allineate come soldatini. In un angolo, una ragnatela grassa. Renfield tiene i conti su un taccuino: colonne di numeri, come un contabile.",'finestr|muro|carfax':"Dalla finestra della cella si vede il muro di Carfax, la vecchia casa disabitata accanto. Renfield la fissa per ore.",'fonograf|cilindr':"Il tuo fonografo Edison. Un diario che non puoi rileggere: solo riascoltare, con la tua voce stanca."},
 topics:{'padron|maestro|signore':"@RENFIELD|Renfield si irrigidisce. 'Padrone? Non so di cosa parla, dottore.' Poi, sottovoce, quasi con tenerezza: 'Arriverà. Arriverà presto.'",'lucy':"@RENFIELD|'Una signorina? Bionda? Pallida?' Renfield sorride. 'Pallida è bello, dottore. Pallida è... promettente.'"},
 acts:()=>[A('renfield|parla|chied|perche|pazient','RENFIELD',()=>{say('RENFIELD',"Renfield ti accoglie con la cortesia di un diplomatico.\n'Dottore! Lei mi giudica un pazzo perché mangio le mosche. Ma le mosche hanno la vita, e la vita è forza. Più vite si prendono, più si vive. Il sangue è la vita, dottore. Il sangue è la vita!'");clue('zoofago')},null,'interrogare Renfield'),
  A('gattin|gatto','IL GATTINO',()=>say('RENFIELD',"'Un gattino, dottore. Un gattino piccolo, liscio, giocoso. Lo nutrirei, lo nutrirei tanto!' Quando rifiuti, il suo viso si fa scuro, e per un istante vedi qualcosa di omicida negli occhi. Poi sorride di nuovo, mansueto."),null,'parlare del gattino'),
  A('avanti|basta|chiud|mina|torna|spegni','SPEGNI IL FONOGRAFO',()=>{pov('M');go('m_storm')},null,'chiudere il diario')]};
SC.m_storm={img:'tempesta',mus:'tensione',amb:'tempesta',enter(){S.chap='IV. WHITBY';qfn(()=>SND.sfx('thunder'))},text:()=>"8 agosto. Diario di Mina.\nLa tempesta arriva da nord come un muro. Onde alte come case si rompono sul faro; la folla si accalca sul molo, sotto i lampi.\nNel fascio del riflettore, una goletta straniera entra in porto a vele spiegate, spinta dal vento come da una mano. Al timone, un uomo. Immobile.\nLa nave si arena sulla sabbia. Dalla prua balza a terra un cane enorme, nero, che corre su per gli scalini verso il cimitero.",
 acts:()=>[A('nave|porto|timon|molo|capit|goletta|bordo|corr','LA NAVE',()=>go('m_ship'),null,'correre alla nave'),
  A('cane|insegu|scal|cimiter|segui','IL CANE',()=>{shot('scogliera_panca');out("Lo insegui su per i 199 scalini, il vento che ti strappa il cappello. In cima, tra le lapidi, niente. Solo la panchina di Swales, fradicia. E un odore di terra smossa, che la pioggia non lava.\nTorni giù, verso la nave.");go('m_ship')},null,'inseguire il cane')]};
SC.m_ship={img:'capitano',mus:'orrore',amb:'pioggia',text:()=>"La goletta si chiama Demeter, da Varna. Il capitano è morto, legato al timone, le mani incrociate su un rosario. Dell'equipaggio, nessuno.\nNella stiva, l'unico carico: grandi casse di legno piene di terra.",
 objs:{'capitan|corpo|timon':"Le mani del capitano sono legate al timone con una cima, e tra le dita stringe un rosario. Gli occhi aperti guardano la costa.",'rosario':"Il rosario è legato ai polsi. Il capitano voleva che chiunque lo trovasse capisse: non si era arreso."},
 acts:()=>[A('giornal|diari|libro|regist|legg|bordo','IL GIORNALE DI BORDO',()=>{if(has('log'))return out("Il giornale di bordo è ormai nelle mani della guardia costiera.");set('log');shot('i_log');qfn(()=>SND.sfx('page'));out("Le ultime pagine, scritte da una mano sempre più incerta:\n'Un uomo in più a bordo. Alto, magro, pallido. I marinai spariscono uno a uno, di notte, senza un grido. Il secondo è impazzito: dice che c'è qualcosa nella stiva. È sceso con un coltello. Non è tornato.'");twist();out("'Mi lego al timone, con il rosario tra le mani. Lui, o la cosa, non oserà toccarmi. Salverò la mia anima, e il mio onore di capitano. Che Dio mi aiuti.'");clue('demeter')},null,'leggere il giornale di bordo'),
  A('cass|carico|terra|etichett','LE CASSE',()=>{out("Dall'alto della scaletta conti le casse, e leggi le etichette: cinquanta casse di terra, per un avvocato di Whitby, il signor Billington. Terra. Dalla Transilvania."+(has('mletter')?"\nCinquanta casse. Whitby. La lettera di Jonathan. Ti si gela il sangue.":"\nChi spedisce terra attraverso mezza Europa?"));clue('billington')},null,'esaminare il carico dall\'alto'),
  A('stiva|scend|apri|dentro','SCENDI NELLA STIVA',()=>death('stiva','cripta',"Approfitti di un momento di confusione e scendi nella stiva. È buio. L'acqua arriva alle caviglie. Una cassa, una sola, non è inchiodata.\nAlzi il coperchio di un palmo, per guardare.\nE qualcosa, dall'interno, lo solleva del tutto."),null,'scendere da sola nella stiva'),
  A('avanti|torn|casa|via|notte|lucy|andare','TORNA A CASA',()=>go('m_swales'),null,'tornare a casa')]};
SC.m_swales={img:'swales_morto',mus:'lucy',amb:'mare',text:()=>"Due mattine dopo trovano il vecchio Swales sulla vostra panchina. Morto. Il collo spezzato, il viso contratto in un'espressione d'orrore che il medico non riesce a spiegare. Gli occhi aperti, rivolti al mare.\nNelle stesse ore, sul molo, un mastino viene trovato sventrato.\nE Lucy, da quella notte, è inquieta: si alza dal letto, prova la porta, si riaddormenta.",
 enter(){twist()},
 acts:()=>[A('preg|addio|swales|piang|occhi','UN ADDIO',()=>out("Gli chiudi gli occhi. 'Qualcosa sta arrivando dal mare,' aveva detto. È arrivato."),null,'dire addio a Swales'),A('lucy|chiav|porta|veglia|stanot','CHIUDI LA PORTA',()=>{set('lockdoor');out("Quella sera chiudi a chiave la porta della camera e ti leghi la chiave al polso, con un nastro. Lucy ride di te. Poi si addormenta.");go('m_cliff')},null,'chiudere a chiave la porta per Lucy'),A('avanti|giorni|notte','AVANTI',()=>go('m_cliff'),null,'andare avanti')]};
SC.m_cliff={img:'scogliera',mus:'tensione',amb:'mare',text:()=>"11 agosto, le tre di notte. Ti svegli di colpo: il letto di Lucy è vuoto."+(has('lockdoor')?" La chiave è sparita dal tuo polso: il nastro è stato sciolto da dita pazienti.":"")+" La porta di casa è aperta.\nCorri fuori in camicia da notte e scialle. Oltre il porto, la luna esce dalle nuvole e illumina la panchina sulla scogliera est.\nC'è una figura bianca, seduta. E qualcosa di lungo e nero, chino su di lei.",
 acts:()=>[A('corr|vai|scal|raggiung|salva|fretta','CORRI',()=>RK({skill:'AGILITÀ',diff:7,what:"Correre fino alla scogliera prima che sia troppo tardi",win:"Arriverai in tempo per vederlo in faccia, e Lucy perderà meno sangue.",lose:"Arriverai tardi: Lucy sarà più debole.",
   onWin(){out("Voli giù per le vie e su per i 199 scalini, più veloce di quanto credevi. Per un attimo, sulla panchina, vedi chiaramente un uomo alto, chino, e due occhi rossi che si alzano verso di te. Poi, solo Lucy.");vant('LA STENOGRAFIA DI MINA');S.f.lhp=(S.f.lhp||0)+1;reachLucy()},onLose(){out("Inciampi sugli scalini e ti sbucci le mani. Quando arrivi, Lucy è sola, e la notte è più fredda.");reachLucy()}}),null,'correre da Lucy (prova)'),
  A('grid|urla|chiam|strill|lucy','GRIDA',()=>{out("'LUCY!' Il grido vola sul porto. La cosa nera alza la testa: un viso bianco, due occhi rossi che brillano. Poi una nuvola copre la luna, e quando torna la luce, la figura nera non c'è più.");reachLucy()},null,'gridare il suo nome (sicuro)'),
  A('attacc|affront|colp|scaccia|lotta','AFFRONTALO',()=>death('scogliera','scogliera',"Corri dritta verso la figura nera, a mani nude, gridando. Lui si alza. È altissimo.\nNon ti tocca nemmeno. Fa solo un passo di lato, e il vento della scogliera fa il resto.\nSotto, il mare di Whitby è nero e profondo."),null,'affrontare la figura')]};
function reachLucy(){shot('scogliera_panca');out("Lucy dorme, la bocca socchiusa, il respiro lungo e affannoso. Si porta una mano alla gola, come se avesse freddo. Le metti lo scialle sulle spalle e lo chiudi con una grossa spilla da balia.");go('m_bat')}
SC.m_bat={img:'lucy_letto',who:'LUCY',pbg:'room',mus:'lucy',amb:'interno',text:()=>"All'alba, sulla gola di Lucy, due piccoli punti rossi con un orlo bianco. 'La spilla,' pensi. 'L'avrò punta io.'\nLe notti seguenti dormi poco. Una sera, tornando, alzi gli occhi verso la vostra finestra.",
 after(){shot('finestra_lucy');qfn(()=>SND.sfx('bats'));out("Lucy è affacciata, addormentata, il viso alla luna. Seduta sul davanzale accanto a lei, una specie di grosso uccello. Poi capisci: un pipistrello. Quando corri di sopra, Lucy è a letto, e respira a fatica.");twist();clue('pipistrello');refresh()},
 acts:()=>[A('esamin|punt|gola|segni|feri|collo|osserv','ESAMINA LA GOLA',()=>{if(S.cl.includes('punture'))return out("Due fori. Non riesci a smettere di pensarci.");shot('i_punture');out("Li guardi da vicino. Troppo regolari per una spilla: due fori alla stessa distanza dei canini di un cane. O di un uomo. E non guariscono, anzi: si allargano.");clue('punture');refresh()},null,'esaminare la gola di Lucy'),
  A('lucy|parla|sogno|ricord|chied','LUCY',()=>{say('LUCY',"Lucy non ricorda niente. Solo un sogno.\n'Qualcosa di lungo e scuro, con gli occhi rossi... e un dolore dolcissimo, Mina. Come annegare. Come quando ti chiamano per nome da molto lontano, e tu vuoi andare.'\nRide, a disagio.");clue('sogno')},null,'chiederle cosa ricorda'),
  A('avanti|posta|letter|jonathan|giorni|notizie','LA POSTA',()=>go('m_letter'),null,'aspettare notizie')]};
SC.m_letter={img:'lettera',who:'AGATA',mus:'whitby',amb:'mare',text:()=>"19 agosto. Finalmente una lettera, da Budapest. Suor Agata, dell'ospedale di San Giuseppe e Santa Maria:\n'Il signor Jonathan Harker è nostro ospite da sei settimane, "+(S.jfate==='S'?"ricoverato per sfinimento. È lucido, ma non dorme se non con la luce accesa, e non vuole specchi in camera.'":"ricoverato per una violenta febbre cerebrale. Nel delirio parla di lupi, di sangue, di fantasmi e di demoni. Chiede di lei.'"),
 acts:()=>[A('part|vai|budapest|jonathan|corr|=si|viaggi','PARTI',()=>{say('LUCY',"Parti la mattina dopo. Lucy tornerà a Londra, dalla madre, a Hillingham. Ti abbraccia sul treno, pallida.\n'Torna presto, Mina cara. E torna sposata.'");shot('ospedale');qfn(()=>SND.sfx('bell',{m:57}));out("A Budapest trovi Jonathan magro, invecchiato di dieci anni, gli occhi di chi ha visto il fondo di qualcosa. Vi sposate lì, al suo capezzale, con suor Agata per testimone.");calm();
   if(S.jcross){shot('i_rosario');say('JONATHAN',"Al collo porta ancora un rosario di grani scuri. Te lo mette al collo con mani che tremano.\n'Portalo tu. Promettimelo, Mina. Sempre.'");vant('IL CROCIFISSO DI BISTRITZ')}
   if(has('jdiary')){set('hasdiary');say('JONATHAN',"Poi ti mette in mano un fascio di pagine cucite, fitte di stenografia, sigillate con la ceralacca.\n'Il mio diario. Non voglio sapere se ciò che c'è scritto è vero o follia. Tienilo tu. Non leggerlo, a meno che non sia necessario.'")}
   go('s_lucy')},null,'partire per Budapest')]};
// ================= VI. HILLINGHAM =================
SC.s_lucy={img:'lucy_letto',who:'LUCY,ARTHUR',pbg:'room',mus:'lucy',amb:'interno',enter(){if(!has('c6')){set('c6');chapter('DIARIO DEL DOTTOR SEWARD','VI. HILLINGHAM','Londra, 3 settembre 1893','S');shot('lucy_letto')}},
 text:()=>"Arthur Holmwood è venuto a supplicarmi: Lucy sta male, e lui non si fida di nessun altro. Così rivedo la donna che mi ha rifiutato.\nÈ bianca come il cuscino. Le gengive ritirate, il respiro corto. Gli esami sono normali. Nessuna malattia che io conosca. Eppure perde sangue ogni notte, come se qualcuno glielo rubasse.",
 objs:{'nastro|collo|velluto':"Lucy porta un nastro di velluto nero al collo, e non lo toglie mai. Nemmeno per dormire.",'finestr':"La finestra della camera chiude male. Sul davanzale, graffi sottili, come di piccole unghie."},
 acts:()=>[A('visit|esamin|gola|collo|nastro|osserv','VISITALA',()=>{shot('i_punture');out("Sotto il nastro di velluto trovi due piccoli fori, bianchi e consumati ai bordi, come morsi vecchi. Non c'è infiammazione. Non c'è niente che spieghi tutto quel sangue perduto.");clue('punture');clue('nessunmale');refresh()},null,'visitarla'),
  A('lucy|parla|sogno|chied','LUCY',()=>say('LUCY',"'Caro John.' Ti sorride come a un vecchio amico, e fa male. 'Non sono malata, sai. Solo stanca. Sogno di camminare, e una voce mi chiama dalla finestra... Ti prego, non dirlo ad Arthur. Si preoccuperebbe.'"),null,'parlare con Lucy'),
  A('telegraf|van helsing|maestro|professor|chiam|amsterdam','CHIAMA VAN HELSING',()=>{clue('nessunmale');out("Telegrafi ad Amsterdam, al tuo vecchio maestro, il professor Abraham Van Helsing: medico, filosofo, metafisico. L'uomo che conosce più malattie oscure di chiunque al mondo.\nArriva in trentasei ore.");go('s_vh')},null,'chiamare Van Helsing')]};
SC.s_vh={img:'trasfusione',who:'VH,ARTHUR',pbg:'room',mus:'lucy',amb:'interno',text:()=>"Van Helsing visita Lucy da solo, a lungo. Quando esce, è grigio.\n'Questo non è uno scherzo, amico John. È questione di vita o di morte. Forse di più.'\nPoi, senza spiegare, prepara gli strumenti: una trasfusione. Serve un donatore giovane e forte. Arthur si toglie la giacca prima che qualcuno glielo chieda.",
 acts:()=>[A('aiut|trasfus|procedi|ago|arthur','LA TRASFUSIONE',()=>{say('VH',"Van Helsing lavora in fretta, con mani da chirurgo. Il sangue di Arthur scorre nelle vene di Lucy, e il colore torna sulle sue guance.\n'Lei è un uomo, ora, giovanotto,' dice il professore ad Arthur. 'E adesso vada. A lei basta questo: l'ha salvata.'");S.f.lhp=(S.f.lhp||0)+1;go('s_garlic')},null,'assistere alla trasfusione'),
  A('don|io|mio sangue|braccio','DONA ANCHE TU',()=>{say('VH',"'Anche lei, amico John? Bene. Ma lei non dirà niente ad Arthur. Un uomo innamorato non deve sapere che un altro ha dato il sangue alla sua donna.'");out("Più tardi saranno in quattro ad aver dato il loro sangue a Lucy. E non basterà.");S.f.lhp=(S.f.lhp||0)+2;guaio('SANGUE DONATO');go('s_garlic')},null,'offrire anche il proprio sangue'),
  A('chied|cos ha|diagnos|cos e|spieg','CHIEDI',()=>say('VH',"'Non mi chieda niente, amico John. Non ancora. Lei non mi crederebbe, e io stesso non voglio crederci. Mi dia fiducia, come quando ero il suo maestro e lei uno studente impertinente.'"),null,'chiedere una diagnosi')]};
SC.s_garlic={img:'lucy_letto',who:'VH,MRSW,LUCY',pbg:'room',mus:'lucy',amb:'interno',text:()=>"Il giorno dopo Van Helsing arriva con una grande scatola: fiori bianchi, freschi, dall'odore pungente. Aglio, da Haarlem. Ne strofina i telai della finestra, la porta, il camino. Ne intreccia una ghirlanda e la mette al collo di Lucy.\n'Non li tolga, Miss Lucy. Per nessun motivo. Stanotte, e tutte le notti.'",
 after(){shot('i_aglio');clue('aglio');refresh()},
 acts:()=>[A('chied|perche|aglio|fiori|spieg','CHIEDI',()=>say('VH',"'Perché l'aglio? Perché è un rimedio, e io sono un medico.' Ti guarda da sotto le sopracciglia folte. 'Lei mi crede un vecchio pazzo. Pazienza. Mi obbedisca comunque.'"),null,'chiedere il perché dei fiori'),
  A('madre|signora|westenra|mamma','LA MADRE',()=>{say('MRSW',"La signora Westenra ti prende in disparte, una mano sul cuore malato.\n'Dottore, quei fiori... Che odore orribile, soffocante! La mia bambina non respira. Stanotte, se dorme, li toglierò io, e aprirò un po' la finestra.'");clue('mrsw');if(has('mrswdone'))return;set('mrswdone');RK({skill:'PAROLA',diff:7,what:"Convincere la signora Westenra a non toccare i fiori",win:"La madre lascerà i fiori al loro posto: Lucy avrà molte più possibilità.",lose:"La signora annuirà, ma farà di testa sua.",onWin(){out("Le parli con tutta l'autorità del medico: quei fiori sono una cura, e toglierli può uccidere Lucy.");say('MRSW',"La signora annuisce, spaventata. 'Va bene, dottore. Non li toccherò. Glielo prometto.'");set('wkeep')},onLose(){say('MRSW',"La signora annuisce, ma con quell'aria distratta di chi ha già deciso. 'Sì, sì, dottore. Certo.'")}})},null,'parlare con la madre di Lucy (prova)'),
  A('veglia|resta|notte|guard|sorvegl','VEGLIA',()=>{set('vigil');S.f.lhp=(S.f.lhp||0)+1;qfn(()=>SND.sfx('bats'));out("Passi la notte su una poltrona accanto al letto di Lucy, la lampada accesa. Verso le due qualcosa sbatte contro il vetro, una, due, tre volte. Ali. Non apri. All'alba Lucy ha un po' più di colore.");go('s_zoo')},null,'vegliare Lucy stanotte'),
  A('avanti|via|torn|purfleet|manicom','TORNA A PURFLEET',()=>go('s_zoo'),null,'tornare al manicomio')]};
SC.s_zoo={img:'zoo',who:'BILDER',pbg:'night',mus:'seward',amb:'citta',text:()=>"18 settembre. Il Pall Mall Gazette riporta una strana storia: un lupo grigio, Bersicker, è fuggito dallo zoo di Regent's Park. Incuriosito, vai a parlare con il guardiano, Thomas Bilder.",
 objs:{'lupi|gabbia|sbarre':"Le sbarre della gabbia vuota sono piegate verso l'esterno. Da fuori."},
 acts:()=>[A('bilder|guardian|parla|chied|lupo','BILDER',()=>{say('BILDER',"'Ieri è venuto un tipo, dottore. Alto, magro, naso a becco, una barbetta a punta. E gli occhi... rossi, glielo giuro. Ha messo la mano nella gabbia, e i lupi, che mordono pure me, gliel'hanno leccata come cagnolini.'");say('BILDER',"Sputa per terra. 'Stanotte Bersicker ha piegato le sbarre ed è scappato. Verso nord. Verso Hampstead, dice la polizia.'");clue('bersicker')},null,'parlare con Bilder'),
  A('hilling|lucy|corr|torna|nord|hampstead|avanti','CORRI DA LUCY',()=>go('l_wolf'),null,'correre a Hillingham')]};
SC.l_wolf={img:'lucy_letto',who:'MRSW',pbg:'room',mus:'tensione',amb:'vento',enter(){if(!has('c7')){set('c7');chapter('MEMORANDUM DI LUCY WESTENRA','VII. LA NOTTE DEL LUPO','Hillingham, notte del 17 settembre','L');shot('lucy_letto')}},
 text:()=>"(Scritto a matita, trovato sul petto di Lucy.)\nSono Lucy. Scrivo perché nessuno sia accusato per causa mia. John stanotte non c'è.\nSono a letto, la ghirlanda d'aglio al collo. Qualcosa sbatte contro la finestra. E poi, fuori, nei cespugli, un ululato: profondo, vicino.\nLa porta si apre. È la mamma, spaventata dal rumore. Si siede sul letto, mi stringe.",
 after(){qfn(()=>SND.sfx('howl'));if(!has('wkeep'))say('MRSW',"'Che odore soffocante, tesoro mio. Non respiri.' La mamma allunga le mani verso la ghirlanda che ho al collo.");else say('MRSW',"'Il dottore ha detto di non toccare i fiori,' sussurra la mamma, accarezzandomi i capelli. 'E io non li tocco.'")},
 acts:()=>[A('fiori|tien|ferm|non|aglio|mamma|no','TIENI I FIORI',()=>{if(has('wkeep')){set('kept');out("Stringo la ghirlanda. La mamma mi bacia la fronte.");wolfNight();return}RK({skill:'PAROLA',diff:7,what:"Convincere la mamma a lasciare la ghirlanda d'aglio",win:"I fiori resteranno al collo: la tua difesa più forte.",lose:"La mamma getterà via i fiori.",onWin(){set('kept');say('MRSW',"'No, mamma. Ti prego. Lasciali.' Lei sospira e lascia ricadere le mani. 'Come vuoi, bambina mia.'");wolfNight()},onLose(){say('MRSW',"'Sciocchezze da olandese.' La mamma sfila la ghirlanda e la getta a terra.");wolfNight()},onNo(){wolfNight()}})},null,'tenere i fiori al collo (prova)'),
  A('apri|finestr|aria|chi e|fallo entrare','APRI LA FINESTRA',()=>death('finestra','lupo',"Qualcosa, fuori, ti chiama per nome. Una voce dolcissima. Scivoli dal letto e apri la finestra, per vedere chi è.\n'Grazie, Lucy,' dice la notte.\nLa mamma grida. Poi più niente. Solo una nebbia che brilla sotto la luna."),null,'aprire la finestra'),
  A('preg|croce|abbracc|stringi','STRINGITI A LEI',()=>{out("Abbraccio la mamma. Sento il suo cuore battere troppo forte, troppo in fretta.");wolfNight()},null,'stringersi alla madre')]};
function wolfNight(){qfn(()=>SND.sfx('glass'));shot('lupo');twist();out("Il vetro esplode. Una testa grigia, enorme, entra dalla finestra tra le schegge. La mamma porta le mani alla gola, emette un gemito, e cade come colpita da un fulmine.");shot('i_nebbia_porta');out("Dalla finestra rotta entra una nebbia fine, scintillante, come una colonna di polvere sotto la luna. Gira attorno al letto.");
 const ex=[];if(S.f.lhp)ex.push([S.f.lhp,'sangue donato da chi ti ama']);if(has('kept'))ex.push([2,"la ghirlanda d'aglio"]);if(has('vigil'))ex.push([1,'la veglia di John']);
 RK({skill:'FEDE',diff:10,forced:1,extra:ex,what:"Resistere alla nebbia fino all'alba",win:"Lucy sopravvive. La storia cambia.",lose:"Lucy muore, come nel romanzo. E poi...",
  onWin(){set('lucysaved');shot('lucy_letto');mus('lucy');out("Stringo i fiori d'aglio al petto con tutte le forze che mi restano. La nebbia si ritrae, si contorce, si sfilaccia nel vento. Un ultimo bagliore rosso, e la finestra è vuota.\nQuando John e il professore arrivano, all'alba, sono ancora viva. Debole, ma viva. La voce che mi chiamava, ora, tace.");pov('M');go('m_piccadilly')},
  onLose(){out("Non ho più forze. La nebbia mi copre come una coperta. Scrivo queste ultime righe. Dio vi protegga tutti.");shot('alba');mus('gameover');pov('S');S.chap='VI. HILLINGHAM';
   out("(Diario di Seward.) Lucy muore il 20 settembre, tra le braccia di Arthur.");say('LUCY',"'Arthur, amore mio, sono così felice che tu sia venuto. Baciami!' La voce è dolce, voluttuosa, una voce che non le avevo mai sentito.");twist();say('VH',"Van Helsing afferra Arthur per il collo con una forza incredibile e lo trascina indietro. 'Non per la vostra vita! Non per la vostra anima!'\nI denti di Lucy sono più lunghi, più aguzzi.");say('LUCY',"Poi lei apre gli occhi, limpidi, e guarda il professore.\n'Mio vero amico. Proteggilo. E dammi pace.'\nMuore.");
   say('VH',"'È finita,' dico. Van Helsing scuote la testa, grave.\n'No. Ahimè, no. È solo l'inizio.'");set('lucydead');pov('M');go('m_piccadilly')}})}
// ================= VIII. PICCADILLY =================
SC.m_piccadilly={img:'piccadilly_strada',who:'JONATHAN',pbg:'room',mus:'seward',amb:'citta',enter(){if(!has('c8')){set('c8');chapter('DIARIO DI MINA HARKER','VIII. PICCADILLY','Londra, 22 settembre 1893','M');shot('piccadilly_strada')}},
 text:()=>"Siamo a Londra per "+(has('lucydead')?"il funerale di Lucy. Non riesco ancora a scriverlo senza tremare.":"far visita a Lucy, che si riprende piano piano.")+" Camminiamo per Piccadilly, Jonathan e io, sotto un cielo color perla.\nD'un tratto Jonathan mi stringe il braccio così forte da farmi male. Fissa un uomo alto e magro, il naso a becco, i baffi neri, che guarda una ragazza graziosa seduta in una carrozza.",
 after(){twist();mus('orrore');say('JONATHAN',"'È lui,' sussurra Jonathan, bianco come un morto. 'Il Conte. Ma è diventato giovane. Mio Dio, se è così... se è così...'")},
 acts:()=>[A('guard|osserv|uomo|lui|conte','GUARDALO',()=>{say('CONTE_G',"L'uomo si volta, per un istante. Labbra rosse, denti bianchi e aguzzi. "+(has('struck')?"Sulla fronte, sotto la tesa del cappello, una cicatrice rossa, recente: la vanga di Jonathan.":"Uno sguardo duro, crudele, sensuale.")+"\nPoi la carrozza riparte, e lui la segue a piedi, verso Hyde Park.");clue('giovane');go('m_diary')},null,'guardare l\'uomo'),
  A('jonathan|tien|sostien|abbracc|calma','SOSTIENI JONATHAN',()=>{out("Lo fai sedere su una panchina. Si addormenta con la testa sulla tua spalla, come un bambino. Quando si sveglia non ricorda niente: chiede solo di tornare a casa.");clue('giovane');calm();go('m_diary')},null,'sostenere Jonathan'),
  A('segu|pedin|insegu','SEGUILO',()=>RK({skill:'INGEGNO',diff:7,what:"Seguire il Conte tra la folla senza farsi notare",win:"Scoprirai dove si nasconde.",lose:"Lo perderai, e lui saprà che lo cercate.",onWin(){out("Lo segui tra la folla per due isolati. Lui non si volta mai, eppure senti che sa. Davanti a un palazzo grigio, il numero 347, si ferma. Poi scompare tra i passanti.");set('saw347');clue('giovane');go('m_diary')},onLose(){out("Lo perdi in un istante, come se si fosse dissolto. Ma per un attimo, tra la folla, hai sentito il suo sguardo addosso. Lui sa che lo cercate.");clue('giovane');go('m_diary')}}),null,'seguirlo (prova)')]};
SC.m_diary={img:'scrittura',who:'VH',pbg:'room',mus:'whitby',amb:'interno',text:()=>(has('hasdiary')?"A casa rompi il sigillo del diario di Jonathan e leggi tutta la notte. Il Borgo, i lupi, la soglia, lo specchio, l'uomo che striscia sui muri"+(has('sisters')?", le tre donne nella luce della luna":"")+(has('list')?", cinquanta casse per Whitby":"")+".":"Jonathan, sconvolto, ti racconta tutto a voce, a pezzi, la notte. Il Borgo, i lupi, lo specchio, l'uomo che striscia sui muri.")+"\nPoi ti siedi alla macchina da scrivere e batti tutto: il suo diario, il tuo, le lettere di Lucy. Le pagine si allineano. E tutte insieme raccontano una sola storia.",
 enter(){clue('vero');qfn(()=>SND.sfx('typewriter'))},after(){if(!has('lucydead'))return;say('VH',"Il 25 settembre bussa alla porta un vecchio signore dalla fronte enorme. 'Madame Mina? Sono Van Helsing. Ero il medico della povera Miss Lucy. Lei teneva un diario, e Miss Lucy le scriveva. Posso leggere?'")},
 acts:()=>[A('mostr|dai|leggi|copie|diario|macchina|vh|professor|fidati','MOSTRA LE PAGINE',()=>{say('VH',"Van Helsing legge le tue pagine dattiloscritte in silenzio, per un'ora. Poi si toglie gli occhiali e ti prende le mani.\n'Madame Mina, lei ha la mente di un uomo e il cuore di una donna. Questo diario di suo marito... è tutto vero. Ogni parola.'");clue('nosferatu');vant('NON SONO SOLA');if(has('hasdiary'))vant('LA FIDUCIA DEL PROFESSORE');out("Quando Jonathan sa che non era pazzo, guarisce in un giorno. 'Ora so,' dice. 'E non ho più paura.'");calm();next8()},null,'mostrare tutto a Van Helsing'),
  A('tien|segret|no|aspett','TIENILE PER TE',()=>{out("Esiti. Sono le cose più intime della tua vita. Poi pensi a Lucy, e alle parole del Conte nel diario: cinquanta casse. Cinquanta. Le consegni comunque, ma senza fidarti fino in fondo.");next8()},null,'tenere le pagine per sé')]};
function next8(){if(has('lucydead'))go('s_bloofer');else{set('arthur');say('LUCY',"Lucy, ancora debole, viene a trovarti ogni giorno con Arthur. 'Ricordo tutto, Mina. Voglio aiutarvi.'");say('ARTHUR',"Arthur ti stringe la mano: 'Quello che serve. Uomini, denaro, chiavi.'");vant("L'AMICIZIA DI ARTHUR");go('m_council')}}
// ================= IX. LA BELLA SIGNORA =================
SC.s_bloofer={img:'giornale',who:'VH',pbg:'room',mus:'lucy',amb:'citta',enter(){if(!has('c9')){set('c9');chapter('DIARIO DEL DOTTOR SEWARD','IX. LA BELLA SIGNORA','Londra, 26 settembre 1893','S');shot('giornale')}},
 text:()=>"La Westminster Gazette parla di bambini scomparsi a Hampstead e ritrovati all'alba, deboli, con piccole ferite alla gola. Raccontano tutti la stessa storia: una bella signora vestita di bianco, che li ha invitati a giocare.\nVan Helsing posa il giornale. 'Che cosa ha fatto quelle ferite, amico John?'",
 acts:()=>[A('pipistrel|animale|cane|medic|non so|spieg','UN ANIMALE',()=>{say('VH',"'Un pipistrello? Un cane? No, amico John.' Il professore ti guarda negli occhi, a lungo. 'Le ha fatte Miss Lucy.'");twist();s_believe()},null,'dare una spiegazione medica'),A('lucy|lei|credo|vampir|dimmi','LUCY',()=>{say('VH',"'Lei lo ha già capito, vedo. Ma non vuole crederlo.'");s_believe()},null,'nominare Lucy')]};
function s_believe(){say('VH',"'Lei mi crede pazzo, amico John. Stanotte verrà con me al cimitero di Kingstead. Se mi sbaglio, mi chiuderà nel suo manicomio.'");go('s_tomb')}
SC.s_tomb={img:'tomba_lucy',who:'LUCY_N,ARTHUR,VH',pbg:'church',mus:'sorelle',amb:'notte',text:()=>"Il cimitero di Kingstead, a mezzanotte. Van Helsing apre la tomba dei Westenra: la bara di Lucy è vuota.\nLa notte dopo torniamo con Arthur e Quincey. Tra i tassi avanza una figura bianca. Lucy. Tiene in braccio un bambino addormentato; sulle labbra, sangue fresco. È bellissima, di una bellezza crudele, voluttuosa.",
 enter(){twist()},after(){say('LUCY_N',"Vede Arthur e sorride, tendendo le braccia.\n'Vieni da me, Arthur. Lascia questi altri e vieni da me. Le mie braccia sono affamate di te. Vieni, e riposeremo insieme. Vieni, marito mio, vieni!'")},
 acts:()=>[A('crocif|croce|alza|fede|ostia','LA CROCE',()=>RK({skill:'FEDE',diff:7,what:"Alzare la croce tra Lucy e Arthur",win:"Lucy fuggirà, e Arthur vedrà la verità.",lose:"Lucy ti riconoscerà, e ti ferirà nell'anima.",onWin(){out("Alzi la croce tra Lucy e Arthur. Lei si ritrae con un sibilo, il viso deformato da una rabbia che non le appartiene. Lascia cadere il bambino e scivola dentro la tomba, attraverso una fessura dove non passerebbe una lama.");stake()},onLose(){say('LUCY_N',"Alzi la croce, ma la mano trema, e Lucy ride: una risata che non è la sua. 'John... caro John. Mi amavi, ricordi?'");if(scare('il sorriso di Lucy'))return;out("Van Helsing ti strappa la croce di mano e la alza lui. Lucy fugge nella tomba.");stake()}}),null,'alzare la croce (prova)'),
  A('bambin|piccol|salva|prend','IL BAMBINO',()=>{out("Ti lanci verso il bambino e lo strappi dalle sue braccia. È freddo, ma respira. Lucy ringhia come un cane a cui strappano l'osso. Poi Van Helsing alza la croce, e lei fugge nella tomba.");vant('NERVI SALDI');stake()},null,'salvare il bambino'),
  A('arthur|tratt|ferm|tien','TRATTIENI ARTHUR',()=>{say('ARTHUR',"Arthur fa un passo verso di lei, le braccia aperte, come in sogno. 'Lucy... Lucy...'");out("Gli afferri il braccio con tutte e due le mani. 'Non è lei, Arthur. Guardala!' Lui guarda. E vede il sangue.");stake()},null,'trattenere Arthur'),
  A('vai da|abbracc|avvicin|amo|ama|lucy','VAI DA LEI',()=>ending(4,'tomba_lucy',"Fai un passo verso di lei. L'hai amata così tanto. E Lucy, ora, ti sorride come non ti ha mai sorriso.\n'John. Caro John. Sei sempre stato il più paziente.' Le sue labbra sono fredde sulla tua gola, poi calde, poi niente.\nA Hampstead, presto, i bambini parleranno di una bella signora e di un signore gentile, col camice da medico."),null,'andare verso Lucy')]};
function stake(){shot('paletto');out("A mezzogiorno del giorno dopo torniamo nella tomba. Lucy dorme nella bara, più bella che mai, le labbra rosse.");say('VH',"Van Helsing tira fuori un paletto di legno lungo tre piedi e un martello. Guarda Arthur.\n'Deve farlo chi la amava. Un colpo solo. È la sua liberazione, non la sua morte.'");say('ARTHUR',"Arthur trema. Guarda me.");S.scene='s_stake';save();const h=hintLine();if(h)out(h,'hint')}
SC.s_stake={img:'paletto',who:'ARTHUR,VH',pbg:'church',mus:'orrore',amb:'cripta',text:()=>"La bara aperta. Il paletto. Il martello. Arthur mi guarda.",
 acts:()=>[A('convinc|parl|incoragg|arthur|aiut|spieg|=puoi','INCORAGGIALO',()=>RK({skill:'PAROLA',diff:7,what:"Dare ad Arthur la forza di liberare Lucy",win:"Arthur diventerà vostro alleato fino in fondo.",lose:"Arthur crollerà, e il professore dovrà farlo al suo posto.",
   onWin(){out("Gli prendo la mano libera. 'Lei ti ha chiesto pace, Arthur. Dagliela.'");qfn(()=>SND.sfx('stake'));out("Arthur posa la punta sul cuore di Lucy e colpisce. Il corpo si inarca, un urlo agghiacciante, poi la pace. Il volto nella bara torna quello di Lucy: dolce, puro, come in vita. Arthur si inginocchia e la bacia.");say('ARTHUR',"Poi si alza, e ci tende la mano.\n'Qualunque cosa serva. Uomini, denaro, chiavi. Fino in fondo.'");set('arthur');vant("L'AMICIZIA DI ARTHUR");calm();pov('M');go('m_council')},
   onLose(){say('ARTHUR',"Le parole mi escono sbagliate. Arthur lascia cadere il martello. 'Non posso. Non posso!'");qfn(()=>SND.sfx('stake'));out("Van Helsing raccoglie il martello e lo fa lui, in silenzio. Arthur esce dalla tomba senza voltarsi.");guaio('SENSI DI COLPA');pov('M');go('m_council')}}),null,'incoraggiare Arthur (prova)'),
  A('io|lo faccio|prend|martell|colp|fallo','FALLO TU',()=>{qfn(()=>SND.sfx('stake'));out("Prendo io il martello. Arthur mi guarda, inorridito e grato. Il primo colpo è il più difficile; l'urlo di Lucy mi resterà dentro per sempre. Poi il suo volto si distende, ed è di nuovo lei.");if(scare("l'urlo di Lucy"))return;say('ARTHUR',"Arthur mi abbraccia, piangendo. 'Fino in fondo, John. Con voi.'");set('arthur');vant("L'AMICIZIA DI ARTHUR");pov('M');go('m_council')},null,'farlo di persona (costa lucidità)')]};
// ================= X. LA CACCIA =================
SC.m_council={img:'consiglio',who:'VH,JONATHAN,ARTHUR,QUINCEY,SEWARD',pbg:'room',mus:'caccia',amb:'fuoco',enter(){if(!has('c10')){set('c10');chapter('DIARIO DI MINA HARKER','X. LA CACCIA','Purfleet, 30 settembre 1893','M');shot('consiglio')}},
 text:()=>"Siamo tutti al manicomio di Seward, attorno a un tavolo: il professore, Jonathan, il dottor Seward, Lord Godalming, Quincey Morris. E io, che ho messo in ordine le carte.\nVan Helsing parla come un generale prima della battaglia.",
 after(){say('VH',"'Il nosferatu non muore come l'ape dopo aver punto. Diventa più forte. Ha la forza di venti uomini, comanda i ratti, i lupi, la nebbia. Ma non può entrare dove non è invitato. Di giorno è solo un uomo. E deve dormire nella sua terra.'\n'Cinquanta casse. Le troveremo, e le renderemo sterili con l'Ostia.'");clue('nosferatu')},
 topics:{'quincey|texas':"@QUINCEY|'Signora, dove c'è da cacciare, io ci sono. In Texas si caccia di giorno. Qui, a quanto pare, anche di notte.'",'arthur':"@ARTHUR|'Ho perso tutto, Mina, tranne la rabbia. Me la tengo stretta.'"},
 acts:()=>[A('insist|anch io|vengo|partecip|voglio|non escludet','INSISTI PER VENIRE',()=>{say('VH',"Van Helsing ti prende le mani. 'Madame Mina, lei ha già fatto molto. È troppo preziosa per esporla.' Gli uomini annuiscono, sollevati, cavallereschi.");RK({skill:'PAROLA',diff:8,what:"Convincere gli uomini a non lasciarti sola al manicomio",win:"Starai con loro: il Conte troverà una donna preparata.",lose:"Resterai al manicomio, al sicuro. Così dicono.",onWin(){out("'Professore, il Conte ha preso Lucy mentre gli uomini la proteggevano dormendo nella stanza accanto. Non lasciatemi sola in una casa con un pazzo che lo chiama Padrone.'\nSilenzio. Poi Van Helsing china la testa. 'Ha ragione. Verrà con noi.'");set('withmen');go('m_renfield')},onLose(){out("Insisti, ma ti trattano con una gentilezza che non lascia spazio. Resterai al manicomio, al sicuro. Così dicono.");go('m_renfield')},onNo(){go('m_renfield')}})},null,'insistere per partecipare alla caccia (prova)'),
  A('accett|va bene|resto|ok|riposo','ACCETTA',()=>{out("Accetti. Gli uomini sono sollevati. Tu no: qualcosa, in questa casa, ti mette i brividi.");go('m_renfield')},null,'accettare di restare fuori')]};
SC.m_renfield={img:'renfield',who:'RENFIELD,SEWARD',pbg:'cell',mus:'seward',amb:'manicomio',text:()=>"Prima di andare a Carfax, Seward ti fa conoscere il suo paziente: Renfield ha chiesto di vedere 'la signora'.\nÈ seduto sul letto della cella, i capelli pettinati, le mani in grembo. Ti guarda a lungo.",
 after(){say('RENFIELD',"'Signora Harker. Lei non dovrebbe essere qui. Torni a casa sua, la supplico. Lontano da questo posto.'\nPoi, a Seward, con una voce lucida e disperata: 'Dottore, mi lasci andare. Stanotte. Subito. Lo chiedo per la salvezza della mia anima. Non posso dirle perché. Mi lasci andare!'")},
 acts:()=>[A('liber|lascia andar|apri|fallo uscire|convinc|seward','CONVINCI SEWARD',()=>RK({skill:'PAROLA',diff:8,what:"Convincere Seward a liberare Renfield",win:"Il Conte perderà la sua porta d'ingresso nel manicomio.",lose:"Seward rifiuterà. Renfield resterà dov'è.",onWin(){out("'John, guardalo. Non è un pazzo che parla. È un uomo che ha paura di se stesso.' Seward esita, poi annuisce. Renfield lascia il manicomio quella sera, accompagnato da un infermiere fino alla stazione.");say('RENFIELD',"Prima di andare ti bacia la mano. 'Che Dio la protegga, signora. Lui non entrerà più per la mia porta.'");set('rfree');go('m_carfax')},onLose(){say('SEWARD',"Seward scuote la testa. 'Mina, è un paziente pericoloso. Non posso.' Renfield crolla sul letto e si copre il viso con le mani.");go('m_carfax')}}),null,'convincere Seward a liberarlo (prova)'),
  A('chied|perche|chi|padron|parla|ascolt','ASCOLTALO',()=>{say('RENFIELD',"Gli prendi le mani attraverso le sbarre. Renfield abbassa la voce. 'Lui mi ha promesso vite. Tante vite, rosse e calde. Mi ha chiesto di farlo entrare. Ma lei... lei è stata gentile. Lui verrà per lei, signora. Non dorma sola. Mi creda!'");twist();clue('avviso');set('warned');go('m_carfax')},null,'ascoltare Renfield'),
  A('vai|via|basta|andiam','VAI VIA',()=>{out("Esci dalla cella. La sua voce ti segue per tutto il corridoio: 'Signora! Signora!'");go('m_carfax')},null,'andarsene')]};
SC.m_carfax={img:'cripta',who:'VH,ARTHUR,QUINCEY,JONATHAN',pbg:'crypt',mus:'tensione',amb:'cripta',text:()=>(has('withmen')?"Di notte, con le lanterne, entri con loro a Carfax.":"Quella notte gli uomini vanno a Carfax senza di te. Dalla finestra vedi le loro lanterne oltre il muro.")+" La cappella che Jonathan stesso ha descritto nell'atto. L'aria è densa di terra, di muffa, e di un odore dolciastro di sangue vecchio.\nLe casse sono lì, allineate contro il muro. Van Helsing apre una scatola d'argento: l'Ostia.\nE dal buio, migliaia di occhi rossi si accendono.",
 acts:()=>has('withmen')?[A('ratti|ostia|cass|steril|consacr|avanti|lavor|resta','RESTA CON LORO',()=>carfaxDone(),null,"restare unita al gruppo"),A('sola|da sola|esplor|avanti da sola|vado','ESPLORA DA SOLA',()=>death('cappella','cripta',"Prendi una lanterna e ti allontani nel corridoio laterale, dove le casse sono più fitte. Un fruscio. Un altro.\nLa marea nera arriva da ogni lato insieme, squittendo, a migliaia. La lanterna cade. Il buio ha denti."),null,'esplorare da sola')]:[A('aspett|attendi|finestr|guard','ASPETTA',()=>carfaxDone(),null,'aspettare il loro ritorno'),A('segui|vai|anch io|raggiung|carfax','RAGGIUNGILI',()=>death('cappella','cripta',"Esci di nascosto e scavalchi il muro di Carfax, da sola, al buio. Il giardino è un labirinto di rovi. La cappella è più lontana di quanto sembrava.\nPoi, ai tuoi piedi, la marea nera. A migliaia."),null,'raggiungerli da sola')]};
function carfaxDone(){out(has('arthur')?"Arthur fischia: i suoi tre terrier si buttano tra i ratti, e la marea nera si ritira, come richiamata da qualcuno.":"Le lanterne tengono i ratti ai margini della luce. Squittiscono, a migliaia. Poi si ritirano, come richiamati da qualcuno.");shot('i_ostia');qfn(()=>SND.sfx('bell',{m:62}));out("Una a una, Van Helsing posa un frammento d'Ostia nella terra di ogni cassa. Ventinove.\nLe casse dovevano essere cinquanta.");twist();shot('cripta');out("Dalla bolla di un trasportatore, Jonathan ricostruisce il resto: nove casse a una casa di Piccadilly, al numero 347"+(has('saw347')?" (la stessa casa grigia dove hai visto sparire il Conte)":"")+", le altre a Mile End e a Bermondsey.");clue('ventinove');if(has('rfree'))go('m_house');else go('m_attack')}
SC.m_attack={img:'nebbia',who:'CONTE_G',pbg:'moon',mus:'orrore',amb:'interno',text:()=>"Notte, al manicomio. Jonathan dorme accanto a te, sprofondato in un sonno pesante, innaturale. Dal giardino, un cane ulula.\nTi svegli. Hai freddo.",
 after(){shot('i_nebbia_porta');qfn(()=>SND.sfx('whisper'));out("Sotto la porta entra una nebbia bianca, sottile come vapore. Si raccoglie, sale, diventa una colonna.");shot('nebbia');twist();out("In cima alla colonna, due occhi rossi.");say('CONTE_G',"E una voce, dentro la tua testa:\n'Silenzio. Se fai un suono, prenderò lui, e gli spaccherò il cervello davanti ai tuoi occhi.'");if(has('warned'))out("Le parole di Renfield. 'Non dorma sola.' Sotto il cuscino, la croce.",'dim')},
 acts:()=>[A('crocif|rosario|croce|cuscin|prega|fede|alza','LA CROCE',()=>{const ex=[];if(has('warned'))ex.push([2,"l'avvertimento di Renfield"]);if(has('withmen'))ex.push([1,'non sei mai stata sola']);RK({skill:'FEDE',diff:9,forced:1,extra:ex,what:"Respingere il Conte con la croce",win:"Il Conte fuggirà senza toccarti.",lose:"Il Conte ti marchierà col suo sangue.",onWin(){out("Alzi la croce. La colonna di nebbia vacilla, si storce come fumo nel vento.");say('CONTE_G',"'Coraggiosa,' dice la voce. 'Le donne coraggiose mi piacciono. Ci rivedremo, Mina.'\nLa nebbia scivola sotto la porta.");shot('renfield_morto');say('SEWARD',"All'alba trovano Renfield nella sua cella, la schiena spezzata. Prima di morire sussurra a Seward:\n'L'ho fatto entrare io. Ma lei aveva la croce. Non l'ha toccata. Non l'ha toccata...'");vant('NERVI SALDI');go('m_house')},onLose:baptism})},null,'alzare la croce (prova obbligata)'),
  A('svegl|jonathan|grid|urla|chiam|aiuto','SVEGLIA JONATHAN',()=>{out("Scuoti Jonathan, gridi il suo nome. Lui non si sveglia. Il Conte ride, piano, e la nebbia ti è già addosso.");baptism()},null,'svegliare Jonathan'),
  A('invit|entr|accett|vieni|=si|apri|prendimi','INVITALO',()=>ending(8,'nebbia',"'Entra,' sussurri. Non sai perché. Forse è la stanchezza, forse la sua voce, che sa di mare e di Transilvania. 'Entra liberamente.'\nLui sorride, e la nebbia ti avvolge come uno scialle.\nAl mattino Jonathan trova il letto vuoto e la finestra aperta. Van Helsing vi cercherà per anni. Ma una signora in nero, a volte, viene vista sui moli di Varna al tramonto, che aspetta una nave. E sorride."),null,'invitarlo')]};
function baptism(){say('CONTE_G',"Lui ti afferra i polsi, ti piega la testa all'indietro. Poi si apre una vena sul petto con l'unghia, e ti costringe a bere.\n'Carne della mia carne. Sangue del mio sangue. Ora sei mia, e un giorno sarai la mia compagna e la mia aiutante.'");shot('renfield_morto');out("Gli uomini sfondano la porta: li ha chiamati Renfield, morente, la schiena spezzata. 'L'ho fatto entrare io,' ha detto. Il Conte svanisce in nebbia.");
 shot('impura');qfn(()=>SND.sfx('sizzle'));twist();out("Van Helsing ti posa l'Ostia sulla fronte per proteggerti. La carne sfrigola come sotto un ferro rovente. Resta una cicatrice rossa.\n'Impura! Impura! Anche l'Onnipotente rifugge dalla mia carne contaminata!'");say('VH',"Il professore ti stringe le mani. 'C'è un rovescio, Madame Mina. Ora lei è legata a lui. All'alba, sotto ipnosi, potrà sentire ciò che lui sente. Useremo la sua stessa catena per trascinarlo.'");set('baptized');set('link');guaio('LA SETE');if(scare('il sangue del Conte'))return;go('m_house')}
SC.m_house={img:'piccadilly',who:'CONTE_G,VH,JONATHAN',pbg:'room',mus:'caccia',amb:'citta',text:()=>"347 Piccadilly. "+(has('arthur')?"Lord Godalming chiama un fabbro in pieno giorno: nessuno sospetta di un lord che ha perso le chiavi di casa.":"Quincey forza la porta sul retro, al crepuscolo: 'In Texas le porte sono un suggerimento.'")+"\nDentro, polvere, lenzuola sui mobili, otto casse nella sala da pranzo. Van Helsing le sterilizza, mentre Arthur e Quincey corrono a Mile End e Bermondsey. Ne manca una sola.\nAl tramonto, una chiave gira nella toppa.",
 after(){qfn(()=>SND.sfx('door'));twist();say('CONTE_G',"Il Conte entra con un balzo da pantera. Vi vede. Un sorriso orribile gli scopre i denti"+(has('struck')?"; sulla fronte, la cicatrice rossa della vanga.":".")+(has('baptized')?" Ti guarda, e tu senti il suo sguardo nelle vene.":""));shot('i_kukri');qfn(()=>SND.sfx('slash'));qfn(()=>SND.sfx('coins'));out("Jonathan si lancia col coltello kukri. La lama squarcia il cappotto: una pioggia di banconote e monete d'oro sul pavimento.");shot('piccadilly')},
 acts:()=>[A('crocif|rosario|croce|ostia|alza|fede','LA CROCE',()=>{out("Alzi la croce. Il Conte si ritrae come colpito, il viso una maschera d'odio.");countFlees()},null,'alzare la croce (sicuro)'),
  A('attacc|colp|coltell|blocc|ferisc','ATTACCA',()=>RK({skill:'CORAGGIO',diff:8,what:"Gettarti su di lui insieme a Quincey",win:"Il Conte resterà ferito: più debole, alla fine.",lose:"Ti scaraventerà contro il muro.",onWin(){qfn(()=>SND.sfx('slash'));out("Ti lanci con Quincey, e il coltello Bowie gli apre il fianco. Il Conte ruggisce, per la prima volta, di dolore.");set('wounded');countFlees()},onLose(){out("È come colpire una statua di ferro. Ti scaraventa via con un gesto, e la testa batte contro il muro.");if(scare('la sua forza'))return;countFlees()}}),null,'attaccarlo (prova)'),
  A('segu|insegu|finestr|salta|dietro','INSEGUILO',()=>death('cortile','piccadilly',"Il Conte si getta dalla finestra, e tu, senza pensare, salti dietro di lui sul cornicione.\nLui è già nel cortile, e alza gli occhi. Sorride.\nIl cornicione è stretto, le pietre bagnate. La tua scarpa scivola."),null,'inseguirlo dalla finestra'),
  A('parla|dic|chied|minacc','PARLAGLI',()=>{say('CONTE_G',"'Hai perso,' gli dici. 'Le tue casse sono sterili. Non hai più dove dormire.' Il Conte ti guarda, e per la prima volta sembra vederti davvero.");countFlees()},null,'parlargli')]};
function countFlees(){qfn(()=>SND.sfx('glass'));out("Il Conte afferra una manciata di monete, e con un balzo si getta contro la finestra. Vetri, luce rossa del tramonto.");say('CONTE_G',"E la sua voce, dal cortile:\n'Credete di sconfiggermi, voi, con le vostre facce pallide in fila, come pecore al macello! Ve ne pentirete. La mia vendetta è appena cominciata. Le vostre ragazze, che tanto amate, sono già mie. E per mezzo loro, sarete miei anche voi.'");clue('fuga');if(has('link'))go('m_hypno');else go('m_docks')}
SC.m_hypno={img:'nave',who:'VH',pbg:'room',mus:'lucy',amb:'mare',text:()=>"L'alba. Van Helsing ti siede davanti e muove lentamente le mani davanti ai tuoi occhi.\n'Dove è lui, Madame Mina? Cosa sente?'\nIl buio. Acqua che sciaborda contro il legno. Catene che corrono, voci d'uomo in una lingua straniera. Una nave che salpa.",
 enter(){qfn(()=>SND.sfx('chains'));clue('nave')},acts:()=>[A('avanti|svegl|apri|ok|basta|parla','SVEGLIATI',()=>{say('VH',"Quando ti svegli, il professore ha già trovato il nome nei registri di Lloyd's: la Czarina Catherine, da Londra a Varna.\n'Va a casa,' dice. 'Va dritto a casa. E noi lo aspetteremo dove la strada sale verso il Borgo.'");go('v_circle')},null,"uscire dall'ipnosi")]};
SC.m_docks={img:'moli',mus:'seward',amb:'mare',text:()=>"Il Conte è sparito. Senza il legame del sangue, non c'è modo di sentirlo. Restano i moli del Tamigi: gru, sartie, nebbia, odore di catrame. Un impiegato del registro del porto si gratta la testa con la penna.",
 acts:()=>[A('chied|regist|impieg|nave|parti|uomo|alto','CHIEDI',()=>RK({skill:'INGEGNO',diff:6,forced:1,what:"Trovare nei registri del porto la nave del Conte",win:"Saprete dove va.",lose:"Il Conte sparirà per sempre.",onWin(){out("'Un uomo alto, magro, pallido, con un cappello di paglia che non c'entrava niente con la stagione. Ha pagato in oro, senza contare. Una cassa sola, enorme. È salito sulla Czarina Catherine, per Varna. Ieri sera.'");clue('nave');go('v_circle')},onLose(){ending(7,'moli',"L'impiegato non ricorda niente, o non vuole ricordare. Cercate per giorni, per settimane. Il Conte è sparito.\nPer anni i giornali parlano di bambini smarriti, di marinai senza sangue nelle darsene, di una nebbia che sale dal Tamigi anche nelle notti limpide.\nTu non smetti di cercare. Ogni volta che la nebbia si addensa sotto un lampione, ti chiedi se ti stia guardando.")}}),null,"chiedere all'impiegato (prova obbligata)")]};
// ================= XI. IL CERCHIO =================
SC.v_circle={img:'neve_cerchio',who:'VH,SORELLE',pbg:'snow',mus:'sorelle',amb:'neve',enter(){if(!has('c11')){set('c11');chapter('DIARIO DI MINA HARKER','XI. IL CERCHIO','Passo del Borgo, 5 novembre 1893','M');shot('neve_castello',1600)}},
 text:()=>"Il Passo del Borgo, sotto la neve. Gli uomini inseguono la cassa lungo il fiume; Van Helsing e io saliamo verso il castello in carrozza.\nAl calare della notte il professore traccia un cerchio d'Ostia sbriciolata attorno a me, nella neve, e accende un fuoco."+(has('baptized')?" La cicatrice sulla fronte mi pulsa: lui è vicino.":""),
 after(){shot('cerchio');qfn(()=>SND.sfx('laugh'));twist();say('SORELLE',"Il fuoco si abbassa. Nella neve che turbina, tre figure prendono forma, ridendo. Le labbra rosse, i denti bianchi.\n'Vieni, sorella. Vieni da noi. Vieni! Vieni!'")},
 acts:()=>[A('resta|preg|croce|fede|dentro|cerchio|no','RESTA NEL CERCHIO',()=>{if(!has('baptized')){out("Stringi la croce. Le sorelle non possono varcare il cerchio. Girano attorno a te fino all'alba, ridendo, poi si dissolvono nel vento.");pov('V');go('v_sisters');return}RK({skill:'FEDE',diff:7,forced:1,what:"Resistere al richiamo del sangue del Conte",win:"Resterai te stessa.",lose:"Perderai una candela di lucidità, ma resterai nel cerchio.",onWin(){out("La cicatrice brucia. Il sangue canta. Ma tu stringi la croce, e resti. All'alba le sorelle si dissolvono nel vento.");pov('V');go('v_sisters')},onLose(){out("Ti alzi senza volerlo. Il professore ti afferra, ti trattiene con tutte le sue forze. Cadete insieme, dentro il cerchio.");if(scare('le voci nella neve'))return;pov('V');go('v_sisters')}})},null,'restare nel cerchio'),
  A('esci|vai|vieni|segui|andare','ESCI DAL CERCHIO',()=>{if(has('baptized'))return ending(5,'cerchio',"'Vieni, sorella.' E tu vai. Esci dal cerchio come in un sogno, il viso in fiamme, la cicatrice che canta.\nVan Helsing ti chiama, ti chiama. Ma le sorelle hanno braccia fredde e dolci, e il castello ha una stanza per te, sotto la luna, dove il tempo non passa.\nCarne della sua carne. Sangue del suo sangue.");death('neve','cerchio',"Fai un passo fuori dal cerchio, solo per vedere meglio. Le sorelle ti sono addosso in un istante, come neve portata dal vento.\nVan Helsing grida il tuo nome. Poi, sotto la luna, solo tre risate. Anzi, quattro.")},null,'uscire dal cerchio')]};
SC.v_sisters={img:'cappella',who:'SORELLE',pbg:'crypt',mus:'orrore',amb:'cripta',enter(){S.chap='XI. IL CERCHIO'},text:()=>"(Memorandum di Abraham Van Helsing.) All'alba lascio Madame Mina nel cerchio e salgo al castello con il paletto e il martello. Nella cappella trovo tre tombe. Nella prima giace la donna bruna.\nÈ così bella, così viva nel suo sonno, che il braccio mi si ferma. Molti cacciatori, prima di me, si sono fermati così. E il sole è tramontato su di loro.",
 acts:()=>[A('colp|paletto|martell|fallo|distrugg|ora','COLPISCI',()=>RK({skill:'CORAGGIO',diff:7,what:"Colpire senza guardare quel volto",win:"Le tre sorelle troveranno pace.",lose:"Esiterai: la loro bellezza ti segnerà.",onWin(){qfn(()=>SND.sfx('stake'));out("Non guardo il volto. Colpisco. Una, due, tre volte. Poi la seconda, la bionda. Poi la terza. Nella cappella resta solo polvere, e la luce del mattino.");sistersDone()},onLose(){out("Esito un istante di troppo. Gli occhi della donna si aprono, e sorride. Poi, lontano, sento la voce di Madame Mina che mi chiama, e il braccio cala.");qfn(()=>SND.sfx('stake'));if(scare('il sorriso della sorella'))return;sistersDone()}}),null,'colpire (prova)'),
  A('preg|croce|ostia|tomb|sigill|prima','PREGA PRIMA',()=>{out("Mi inginocchio e prego, per loro e per me. Quando mi rialzo, il braccio è fermo. Colpisco, tre volte, senza guardare.");qfn(()=>SND.sfx('stake'));calm();sistersDone()},null,'pregare prima di colpire (sicuro)')]};
function sistersDone(){shot('neve_castello');out("Poi trovo la tomba più grande, con una sola parola: DRACULA. È vuota. Ci metto l'Ostia. Non avrà più dove tornare.");pov('M');go('f_race')}
// ================= XII. AL TRAMONTO =================
SC.f_race={img:'neve_carro',who:'JONATHAN,QUINCEY,VH',pbg:'snow',mus:'finale',amb:'neve',enter(){if(!has('c12')){set('c12');chapter('DIARIO DI MINA HARKER','XII. AL TRAMONTO','6 novembre 1893','M');shot('neve_castello',1500)}},
 text:()=>"Il sole è già basso sulle montagne. Giù per la strada, un carro di zingari Szgany corre verso il castello. Sul carro, una grande cassa. Lo scortano cavalieri armati.\nDa est e da sud arrivano al galoppo Jonathan, Arthur, Seward e Quincey. Gli zingari tirano fuori i fucili.\nSe il sole tramonta prima, non lo prenderete più.",
 acts:()=>[A('grid|incit|urla|chiam|ora|presto|avanti|corr|attacc|aiut|croce|alza|fucil|spar','ALL\'ATTACCO',()=>finalRoll(),null,"l'assalto finale (prova obbligata)")]};
function finalRoll(){const ex=[];if(has('arthur'))ex.push([1,'Arthur e i suoi uomini']);if(has('struck'))ex.push([1,'la cicatrice della vanga']);if(has('wounded'))ex.push([1,'la ferita di Piccadilly']);if(has('lucysaved'))ex.push([1,'Lucy è viva']);if(S.v.includes('IL CROCIFISSO DI BISTRITZ'))ex.push([1,'il rosario di Bistritz']);
 qfn(()=>SND.sfx('gunshot'));RK({skill:'CORAGGIO',diff:9,forced:1,extra:ex,what:"Raggiungere la cassa prima che il sole tramonti",win:"Il Conte sarà distrutto. Se il margine è ampio, tutti tornerete a casa.",lose:"Il sole tramonterà prima.",
  onWin(m){shot('neve_carro');out("Jonathan si apre la strada tra gli zingari a colpi di kukri. Quincey lo segue, e vedi un coltello balenare: Quincey vacilla, la mano sul fianco. Ma insieme sollevano il coperchio della cassa.");shot('conte_ferito');out("Il Conte giace sulla terra, pallido come cera. Gli occhi rossi fissano il sole che tramonta con uno sguardo di trionfo.");shot('i_kukri');qfn(()=>SND.sfx('slash'));out("In quell'istante il kukri di Jonathan gli squarcia la gola, e il coltello Bowie di Quincey gli si pianta nel cuore.");
   shot('polvere');mus('vittoria');out("Il corpo si sbriciola in polvere sotto i vostri occhi. E sul suo viso, prima della fine, un'espressione di pace che non avresti mai creduto possibile.");
   if(m>=2)ending(1,'polvere',"Gli zingari fuggono. Il sole tramonta. La ferita di Quincey è profonda ma pulita: Seward la cuce lì, nella neve, e lui ride per tutto il tempo.\nTutti vivi."+(has('baptized')?" Ti tocchi la fronte: la cicatrice è sparita.":"")+(has('lucysaved')?" A Londra, Lucy aspetta Arthur con un vestito da sposa.":"")+"\nSette anni dopo nasce vostro figlio. Queste pagine restano in una cassa, in soffitta. Nessuno, leggendole, crederebbe a una parola.");
   else{say('QUINCEY',"Quincey è a terra, la mano premuta sul fianco, il sangue che scorre tra le dita. Guarda la tua fronte"+(has('baptized')?", dove la cicatrice è svanita":"")+", e ride.\n'Ringrazio Dio che non è stato tutto invano! Guardate! La neve non è più immacolata della sua fronte!'");ending(2,'polvere',"Quincey Morris muore così, sorridendo, un gentiluomo.\nSette anni dopo nasce vostro figlio. Il giorno del suo compleanno coincide con quello in cui morì Quincey. Lo chiamate col suo nome.\nQueste pagine restano in una cassa, in soffitta. Nessuno, leggendole, crederebbe a una parola.")}},
  onLose(){if(has('baptized'))ending(5,'polvere',"Il sole affonda dietro il Borgo un istante prima che la lama arrivi. Il coperchio salta. Il Conte si alza nella penombra, e ti guarda, oltre la neve, oltre gli uomini. Ti sorride.\nPoi è nebbia, e la nebbia sale verso il castello.\nQuella notte la cicatrice sulla tua fronte smette di bruciare. Non perché è finita. Perché hai smesso di combattere.");
   else ending(7,'polvere',"Il sole affonda dietro il Borgo un istante prima che la lama arrivi. Il coperchio salta, e la cassa è vuota: solo terra, e un odore di nebbia.\nTornate in Inghilterra. Vivete, invecchiate. Ma ogni volta che la nebbia sale dal Tamigi nelle notti limpide, sai che da qualche parte qualcuno sta ancora aspettando.")}})}
// ---------- dettagli esaminabili aggiuntivi (GUARDA X / ESAMINA X)
const OBJ=(id,o,t)=>{SC[id].objs=Object.assign(SC[id].objs||{},o);if(t)SC[id].topics=Object.assign(SC[id].topics||{},t)};
OBJ('j_mother',{'donna|madre':"I capelli sciolti, il vestito strappato dai rovi. Ha camminato tutta la notte per arrivare fin qui.",'portone|cortile':"Il portone è chiuso. Lo sarà sempre, per lei.",'lupi|torre':"Dalla torre, una figura nera con le braccia alzate. I lupi rispondono al suo richiamo come cani al fischio."});

 const fillp=(P,c)=>{let y0=1e9,y1=-1e9;for(const q of P){y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1])}for(let y=Math.ceil(y0);y<=y1;y++){const xs=[];for(let i=0;i<P.length;i++){const a=P[i],b2=P[(i+1)%P.length];if((a[1]<=y&&b2[1]>y)||(b2[1]<=y&&a[1]>y))xs.push(a[0]+(y-a[1])/(b2[1]-a[1])*(b2[0]-a[0]))}xs.sort((m,n)=>m-n);for(let k=0;k+1<xs.length;k+=2)for(let x=Math.round(xs[k]);x<Math.round(xs[k+1]);x++)if(x>=0&&x<SW&&y>=0&&y<SH)BUF[y*SW+x]=c}};

 fillp(tri,PAL[2]);for(let i=0;i<6;i++)ln(pts[i],pts[(i+1)%6],col);for(let i=0;i<3;i++){ln(tri[i],tri[(i+1)%3],C_DIM);ln(tri[i],pts[[5,1,3][i]],C_DIM);ln(tri[i],pts[[0,0,2][i]],C_DIM);ln(tri[i],pts[[4,2,4][i]],C_DIM)}

// ---------- game flow
function toTitle(){mode='title';screen=null;queue=[];page=null;waitKey=false;promptOn=false;die=null;RISK=null;setImg('title');input='';inp.value='';menuSel=0;SND.music('titolo');SND.amb('vento')}
function newGame(){S=newState();UNDO.length=0;mode='play';screen=null;queue=[];page=null;waitKey=false;fails=0;RECENT.length=0;SPK=null;go('j_inn');pump()}
function contGame(s){restore(s,"Il diario si riapre dove l'avevi lasciato.")}
function menuPick(k){SND.resume();SND.sfx('enter');if(k==='n'){clearSave();newGame()}else if(k==='c'){const s=loadSave();if(s)contGame(s)}else if(k==='l'){const s=loadSave('dracula_slot');if(s)contGame(s)}else if(k==='f')screen='finali';else if(k==='g'){screen='guida';helpPage=0}else if(k==='o'){screen='opzioni';optSel=0}else if(k==='r'){screen='crediti';credT=performance.now();SND.music('vittoria')}}
function screenBack(){if(screen==='crediti')SND.music('titolo');screen=null;SND.sfx('menu')}
function handleChar(cmd){const c=norm(cmd);
 if(mode==='title'){if(screen){screenBack();return}const it=menuItems();const m=it.find(x=>c===x.k||(c&&x.t.toLowerCase().startsWith(c)));if(m)menuPick(m.k);return}
 if(mode==='yn'){if(/^(s|si|y|yes|ancora|nuov)/.test(c)){newGame()}else if(/^cred/.test(c)){toTitle();menuPick('r')}else if(/^(n|no|menu)/.test(c)){toTitle()}else out('Scrivi SI, NO o CREDITI.','dim');pump();return}

 if(thinking)return;submit(cmd)}

function keyNav(e){SND.resume();const k=e.key;
 if(RISK){if(k==='ArrowLeft'||k==='ArrowRight'||k==='Tab'){RISK.sel=RISK.forced?0:1-RISK.sel;SND.sfx('menu');return true}if(k==='Enter'||k===' '){if(performance.now()-RISK.t0>350)decideRisk(RISK.forced||RISK.sel===0);return true}if(/^[tsy]$/i.test(k)){decideRisk(true);return true}if(/^[rn]$/i.test(k)&&!RISK.forced){decideRisk(false);return true}if(k==='Escape'&&!RISK.forced){decideRisk(false);return true}return true}
 if(die){if(k.length===1||k==='Enter'||k===' '){advance()}return true}
 if(mode==='title'){if(screen==='guida'){if(k==='ArrowRight'||k==='Enter'||k===' '){if(helpPage<HELP.length-1){helpPage++;SND.sfx('page')}else screenBack()}else if(k==='ArrowLeft'){helpPage=Math.max(0,helpPage-1);SND.sfx('page')}else if(k==='Escape')screenBack();return true}
  if(screen==='opzioni'){if(k==='ArrowDown'){optSel=(optSel+1)%7;SND.sfx('menu')}else if(k==='ArrowUp'){optSel=(optSel+6)%7;SND.sfx('menu')}else if(k==='ArrowLeft')optChange(optSel,-1);else if(k==='ArrowRight'||k==='Enter'||k===' ')optChange(optSel,1);else if(k==='Escape')screenBack();return true}
  if(screen){screenBack();return true}const it=menuItems();
  if(k==='ArrowDown'){menuSel=(menuSel+1)%it.length;SND.sfx('menu');return true}if(k==='ArrowUp'){menuSel=(menuSel+it.length-1)%it.length;SND.sfx('menu');return true}if(k==='Enter'||k===' '){menuPick(it[menuSel].k);return true}if(k.length===1){handleChar(k);return true}return true}
 return false}
